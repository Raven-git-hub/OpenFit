<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenFit</title>
<style>
/* ============================================================
   CUSTOMISE OPENFIT HERE
   Every colour, radius and font in the whole interface comes
   from the tokens below. Change these and the entire app
   re-skins - you never need to hunt through the markup.
   The bare :root block is the LIGHT theme; the two blocks
   after it are the DARK theme (OS-driven, then the toggle).

   Fonts: the design uses Archivo + IBM Plex Sans/Mono, named
   first in each stack so they are used when installed locally.
   They are deliberately NOT fetched from a font CDN - OpenFit
   makes no external calls, and a home server may well be
   offline. To get them exactly, drop the .woff2 files beside
   this file and add @font-face rules here.
   ============================================================ */
:root{
  color-scheme:light;

  /* neutrals - a slate biased very slightly toward the teal accent */
  --bg:#eef1f0;
  --surface:#ffffff;
  --surface-2:#e9edec;
  --inset:#f4f6f5;
  --border:#d5dcda;
  --border-strong:#c2cbc9;
  --ink:#141c1b;
  --ink-2:#3c4746;
  --muted:#697472;

  /* one accent, used only for interactive things */
  --accent:#0e9c8b;
  --accent-ink:#ffffff;
  --accent-soft:#d4efeb;

  /* metric hues - intuitive, and distinct from each other */
  --m-weight:#0e9c8b;   /* teal   */
  --m-steps:#c07d18;    /* amber  */
  --m-sleep:#5b58c4;    /* indigo */
  --m-heart:#c94f4a;    /* coral  */

  /* status - reserved, never reused as a metric colour */
  --good:#2f9e5b;
  --warn:#c08a1a;
  --crit:#c94f4a;

  /* data console - the continuity marks (rhombuses + 5-week grid).
     Source-agnostic, so one colour; built from the tokens above, so
     they follow the theme without a dark-mode copy of their own. */
  --coverage:var(--accent);             /* a day / week / month with data */
  --coverage-off:var(--surface-2);      /* a grid day with none */
  --coverage-edge:var(--border-strong); /* the outline of an empty rhombus */

  /* home - the app tiles, on a grid six cells across. A cell is
     square: Home's width over six, held between --tile-cell-min and
     --tile-cell-max (past the max the grid centres, with margins), with
     --tile-gap between. A tile spans its size in cells. --tile-guide
     marks the empty cells while Configure is on; --spark draws a
     sparkline (both follow the theme through the tokens above). */
  --tile-cell-min:90px;
  --tile-cell-max:180px;
  --tile-gap:12px;
  --tile-guide:color-mix(in srgb, var(--border) 35%, transparent);
  --spark:var(--accent);

  /* timeline - an interval timeline's two lanes, one hue: lane 0 (the
     left, a plan - rostered) the lighter tone, lane 1 (the right, the
     actual - flown) the darker, each with the ink that reads on it. Its
     now line is --accent, as is a synced timeline's fixed cursor; the
     greyed future and the frame, the neutrals. A lane's bands - a trip
     away, its layovers - are --layover, amber, a soft tint behind the
     blocks with a dashed edge. */
  --timeline-a:#b4a8f0;
  --timeline-a-ink:var(--ink);
  --timeline-b:#5a47c9;
  --timeline-b-ink:var(--accent-ink);
  --layover:#c07d18;

  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,28,27,.06), 0 8px 24px rgba(20,28,27,.05);

  --font-display:'Archivo', system-ui, sans-serif;
  --font-body:'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1316;
    --surface:#161d21;
    --surface-2:#1d262b;
    --inset:#121a1e;
    --border:#2a343a;
    --border-strong:#39454c;
    --ink:#e9eeef;
    --ink-2:#b3bec2;
    --muted:#7f8c92;
    --accent:#31d3bf;
    --accent-ink:#052420;
    --accent-soft:#123832;
    --m-weight:#31d3bf;
    --m-steps:#e0a83a;
    --m-sleep:#8f8cf0;
    --m-heart:#ea6a63;
    --good:#46c06e;
    --warn:#e0a83a;
    --crit:#ea6a63;
    --timeline-a:#b3a9f4;
    --timeline-a-ink:var(--accent-ink);
    --timeline-b:#5d4ecc;
    --timeline-b-ink:var(--ink);
    --layover:#e0a83a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1316;
  --surface:#161d21;
  --surface-2:#1d262b;
  --inset:#121a1e;
  --border:#2a343a;
  --border-strong:#39454c;
  --ink:#e9eeef;
  --ink-2:#b3bec2;
  --muted:#7f8c92;
  --accent:#31d3bf;
  --accent-ink:#052420;
  --accent-soft:#123832;
  --m-weight:#31d3bf;
  --m-steps:#e0a83a;
  --m-sleep:#8f8cf0;
  --m-heart:#ea6a63;
  --good:#46c06e;
  --warn:#e0a83a;
  --crit:#ea6a63;
  --timeline-a:#b3a9f4;
  --timeline-a-ink:var(--accent-ink);
  --timeline-b:#5d4ecc;
  --timeline-b-ink:var(--ink);
  --layover:#e0a83a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.45;
}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- app shell: top bar + rhombus tab strip ---------- */
.app{min-height:100vh;}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:20px 30px 0;
}
.brand{display:flex;align-items:center;gap:11px;}
.brand-mark{
  width:32px;height:32px;border-radius:8px;flex:none;
  background:
    radial-gradient(circle at 50% 50%, var(--accent) 0 4px, transparent 5px),
    conic-gradient(from -90deg, var(--accent) 0 72%, var(--border-strong) 72% 100%);
  -webkit-mask:radial-gradient(circle at 50% 50%, transparent 6px, #000 7px);
          mask:radial-gradient(circle at 50% 50%, transparent 6px, #000 7px);
}
.brand-name{font-family:var(--font-display);font-weight:800;letter-spacing:.5px;font-size:23px;}
.brand-name b{color:var(--accent);}

.status-stack{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.datepill{
  background:var(--surface);border:1px solid var(--border);border-radius:22px;
  padding:7px 15px;box-shadow:var(--shadow);
  font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink);
}
/* the small pill buttons under the date: Settings, then the theme toggle */
.bar-btns{display:flex;gap:8px;}
.bar-btn{
  border:1px solid var(--border);border-radius:20px;background:var(--surface);
  color:var(--muted);font-size:11.5px;font-family:var(--font-mono);padding:6px 13px;
}
.bar-btn:hover{border-color:var(--accent);color:var(--accent);}

.tabstrip{
  display:flex;gap:8px;align-items:flex-end;
  padding:18px 30px 0;margin-top:8px;
  border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;
}
.tabstrip::-webkit-scrollbar{display:none;}
.tab{
  border:none;background:var(--surface-2);color:var(--ink-2);
  font-family:var(--font-display);font-weight:700;font-size:13.5px;letter-spacing:.3px;
  padding:11px 30px;transform:skewX(-14deg);border-radius:7px 7px 0 0;
  white-space:nowrap;position:relative;top:1px;transition:background .12s,color .12s;
}
.tab>span{display:inline-block;transform:skewX(14deg);}
.tab:hover{background:var(--surface);color:var(--ink);}
.tab.active{background:var(--accent);color:var(--accent-ink);}
.tab-add{margin-left:auto;background:transparent;border:1.5px dashed var(--border-strong);color:var(--muted);font-weight:600;}
.tab-add:hover{background:transparent;border-color:var(--accent);color:var(--accent);}
.tab[hidden]{display:none;}
/* Home's tabs - the layout's, drawn by the page - hold the left end, in
   the strip as if they were its own; Data sits at the right end, beside
   Add (shown only while Configure is on) */
.layout-tabs{display:contents;}
.tab-end{margin-left:auto;}
.tab-end + .tab-add{margin-left:0;}
/* Configure: a tab's gear, just after it - rename it, or delete it */
.tab-gear{
  width:24px;height:24px;flex:none;padding:0;border-radius:50%;display:grid;place-items:center;
  align-self:center;margin-left:-3px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);
}
.tab-gear:hover{border-color:var(--accent);color:var(--accent);}
.tab-gear:focus-visible{border-radius:50%;}
.tab-gear:disabled{opacity:.5;cursor:not-allowed;}
.tab-gear svg{width:12px;height:12px;fill:currentColor;}

.main{padding:24px 30px 60px;min-width:0;}

/* buttons + inputs */
.btn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
  border-radius:var(--radius-sm);padding:9px 14px;font-weight:600;font-size:13.5px;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.primary:hover{filter:brightness(1.05);color:var(--accent-ink);}
/* destructive: an outline in the status red, and solid for the final confirm */
.btn.danger{border-color:var(--crit);color:var(--crit);}
.btn.danger:hover{border-color:var(--crit);color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,var(--surface));}
.btn.danger.solid{background:var(--crit);color:var(--surface);}
.btn.danger.solid:hover{background:var(--crit);color:var(--surface);filter:brightness(1.05);}
.btn.sm{padding:6px 10px;font-size:12.5px;}
/* an icon before a button's label - the gear on a source's Settings */
.btn .ico{width:13px;height:13px;fill:currentColor;vertical-align:-2px;margin-right:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn:disabled:hover{border-color:var(--border-strong);color:var(--ink);filter:none;}
/* a link that acts as a button - the OAuth consent link, which has to be
   a real anchor so it can open in a new tab */
a.btn{display:inline-block;text-decoration:none;}
.field{display:flex;flex-direction:column;gap:5px;}
.field[hidden]{display:none;}
.field label{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}
.input, select.input{
  background:var(--inset);border:1px solid var(--border);color:var(--ink);
  border-radius:var(--radius-sm);padding:10px 11px;font-size:14px;font-family:var(--font-body);width:100%;
}
.input:focus{border-color:var(--accent);outline:none;}
.form-msg{font-size:12px;font-family:var(--font-mono);margin-top:8px;min-height:16px;}
.form-msg.ok{color:var(--good);}
.form-msg.bad{color:var(--crit);}
.form-msg.info{color:var(--muted);}

/* ---------- popover menu ---------- */
.pop{
  position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:6px;min-width:210px;
  max-height:min(320px,60vh);overflow-y:auto;
}
.pop-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);padding:6px 9px 4px;font-weight:700;}
.pop-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;color:var(--ink);
  padding:8px 9px;border-radius:7px;font-size:13.5px;text-align:left;}
.pop-item:hover{background:var(--surface-2);}

/* ---------- the Data tab: two columns ----------
   Connected sources and Your data stacked on the left, Applications on
   the right, splitting the window's width evenly. Capped so it doesn't
   sprawl across a very wide monitor; at 1240px and under it drops to
   one column (responsive, below). */
.console{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;max-width:1600px;}
.console-col{display:flex;flex-direction:column;gap:18px;min-width:0;}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.card h3{font-family:var(--font-display);font-weight:700;font-size:17px;margin:0 0 3px;}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 16px;}
/* a card's title, with its voice button just after it */
.card-title{display:flex;align-items:center;gap:9px;margin:0 0 3px;}
.card .card-title h3{margin:0;}
.voice-btn{
  width:24px;height:24px;flex:none;padding:0;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);
}
.voice-btn:hover{border-color:var(--accent);color:var(--accent);}
.voice-btn.playing{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.voice-btn:focus-visible{border-radius:50%;}
.voice-btn svg{width:10px;height:10px;fill:currentColor;}

/* ---------- connected sources ---------- */
.src{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.src-name{font-weight:600;min-width:0;}
/* an uninstalled app's data: its source id under its name */
.src-note{display:block;font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--muted);overflow-wrap:anywhere;}
/* ...and its head opens the list of the metrics it left behind, each
   removable on its own, under its name */
.src.orphan{align-items:flex-start;}
.orphan-item{flex:1 1 220px;min-width:0;}
.orphan-head{
  display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:8px;align-items:baseline;
  width:100%;border:none;background:none;padding:0;color:var(--ink);text-align:left;font:inherit;font-weight:600;
}
.orphan-item .chev{color:var(--muted);display:inline-block;transition:transform .15s;}
.orphan-item.open .chev{transform:rotate(90deg);}
.orphan-metrics{list-style:none;margin:10px 0 0 20px;padding:0;display:flex;flex-direction:column;gap:6px;max-width:320px;}
.orphan-metric{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;}
.orphan-item .dnote{margin:10px 0 0 20px;}
.src-r{display:flex;align-items:center;gap:10px;flex:none;}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;font-family:var(--font-mono);white-space:nowrap;}
.pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);}
.pill.wait{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);}
.pill.primary{color:var(--accent);background:var(--accent-soft);letter-spacing:.6px;}
/* the Add source button at the foot of Connected sources */
.src-add{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;margin-top:2px;border-top:1px solid var(--border);}
.src + .src-add{border-top:none;margin-top:0;}

/* ---------- applications ----------
   Two blocks, stacked in the Data tab's right column. On top, the
   controls card: its title, then Add Application, with Browse / Build /
   Create grouped at the far end. Under it, the list: one row per
   installed app. A row is a Your data row (.ditem, its head a .drow), so
   it opens and closes the same way: chevron · name, and under it a
   .dpanel of Reads · Files · Writes, then Refresh and Uninstall. */
.app-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.app-tools{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;}
.card.applist{padding:10px;}
.arow{display:grid;grid-template-columns:16px minmax(0,1fr);align-items:center;column-gap:12px;}
.a-name{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dpanel.apanel{grid-template-columns:repeat(3,minmax(0,1fr));}
.akeys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.akey{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere;}
/* a file: opens the read-only viewer */
.afile{
  border:none;background:none;padding:1px 0;color:var(--accent);text-align:left;
  font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere;
}
.afile:hover{text-decoration:underline;}
/* the writes ticker's slot: Day / Wk / Mth, as Your data's continuity */
.aticks .rh-cell{gap:2px;}
.atick-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}
.atick-v{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);}
/* Refresh on the left, Update, Duplicate and Uninstall at the far end;
   the confirm under them */
.a-acts, .a-confirm, .a-msg{grid-column:1 / -1;}
.a-acts{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.a-acts[hidden]{display:none;}
.a-acts-end{display:flex;gap:10px;}
.a-msg{margin-top:0;}
.a-msg:empty{display:none;}
.danger-panel code{font-family:var(--font-mono);font-size:12.5px;}
/* in a row's panel, the confirm keeps its own title, not the column headers' */
.dpanel .danger-panel h5{
  font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--crit);
  text-transform:none;letter-spacing:normal;margin:0 0 4px;
}
/* the file viewer: the file's text as-is, read-only */
.modal h4 code{font-family:var(--font-mono);font-size:15px;}
.file-view{
  margin:0;max-height:60vh;overflow:auto;padding:12px;color:var(--ink);
  background:var(--inset);border:1px solid var(--border);border-radius:var(--radius-sm);
  font-family:var(--font-mono);font-size:12.5px;line-height:1.5;tab-size:4;white-space:pre;
}
/* the controls card's one line of news - what the last install did */
.app-msg:empty{display:none;}

/* the Add Application popup: wider than the other modals, to hold the
   app's files - one slot each, a name over a paste box, with Upload */
.modal.wide{width:min(640px,100%);}
.fslot{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--inset);padding:10px 12px 12px;margin-bottom:10px;}
.fslot-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.fslot-name{font-family:var(--font-mono);font-weight:600;font-size:13px;}
.fslot-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}
.fslot-h .fslot-btns{display:flex;gap:6px;margin-left:auto;flex:none;}
.fslot-h .input.fname{width:auto;flex:1;min-width:0;padding:6px 9px;font-size:13px;font-family:var(--font-mono);background:var(--surface);}
.fslot textarea.input{
  display:block;min-height:120px;resize:vertical;background:var(--surface);
  font-family:var(--font-mono);font-size:12.5px;line-height:1.5;tab-size:4;white-space:pre;
}
/* the confirm step: what's installed, and where its code comes in */
.install-id{font-size:14px;margin:4px 0 12px;}
.install-id.bad{color:var(--crit);font-size:13px;}
.install-id code, .install-files code{font-family:var(--font-mono);font-weight:600;}
.install-files{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px;}
.install-files li{border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;background:var(--inset);}
.install-warn{
  border:1px solid color-mix(in srgb,var(--warn) 45%,var(--border));border-radius:var(--radius-sm);
  background:color-mix(in srgb,var(--warn) 9%,var(--surface));padding:10px 12px;font-size:13px;color:var(--ink-2);margin:0;
}
/* an update's confirm, at the foot of its Review, by its Update */
.update-sure{margin-top:12px;}

/* ---------- floating modal: add-device flows, Settings, the coming-soon stub ---------- */
.modal-bg{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;width:min(420px,100%);max-height:88vh;overflow:auto;}
.modal h4{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0 0 3px;}
.modal .hint{color:var(--muted);font-size:13px;margin:0 0 16px;}
.modal .field{margin-bottom:12px;}
.modal h4 + .field{margin-top:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
/* Remove source on the left, Close on the right */
.modal-actions.split{justify-content:space-between;}
/* one button on the left, the rest on the right - Delete tab */
.modal-actions .lead{margin-right:auto;}
/* a source's Settings: its account as a label / value list */
.info{display:grid;grid-template-columns:auto minmax(0,1fr);margin:14px 0 0;}
.info dt, .info dd{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.info dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;padding-right:18px;}
.info dd{justify-content:flex-end;gap:10px;margin:0;text-align:right;font-size:13.5px;overflow-wrap:anywhere;}
.info dt:last-of-type, .info dd:last-of-type{border-bottom:none;}
/* a row of preset buttons as one choice - Sync every; the chosen one is
   .primary, and the row is inert while it loads or saves */
.seg{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;}
.seg[aria-busy="true"]{opacity:.6;pointer-events:none;}
/* the popup's error line takes no room until there is one */
.src-msg:empty{display:none;}
/* the remove gate's "Wipe data?" choice */
.danger-panel{
  border:1px solid color-mix(in srgb,var(--crit) 45%,var(--border));border-radius:var(--radius-sm);
  background:color-mix(in srgb,var(--crit) 7%,var(--surface));padding:14px;
}
.danger-panel h5{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--crit);margin:0 0 4px;}
.danger-panel p{font-size:13px;color:var(--ink-2);margin:0;}
.danger-panel .modal-actions{margin-top:12px;}
/* straight under the title (the are-you-sure step) */
.danger-panel:first-child{margin-top:12px;}

/* ---------- the data card ----------
   One row per metric, series and session kind:
   chevron · name · reading · grain · (gap) · Day/Wk/Mth rhombuses.
   The caption row uses the same grid, so its captions sit over the
   columns they name. */
.card.data{padding:20px 10px 10px;}
.card.data .card-head{padding:0 10px 12px;}
.card.data .card-head .form-msg{margin:4px 0 0;min-height:0;}
.dgrid{display:grid;grid-template-columns:16px minmax(0,200px) 120px 90px 1fr auto;align-items:center;column-gap:12px;}
.dcap{
  padding:0 10px 8px;border-bottom:1px solid var(--border);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;
}
.ditem{border-bottom:1px solid var(--border);}
.ditem:last-child{border-bottom:none;}
.drow{
  width:100%;border:none;background:none;color:var(--ink);text-align:left;
  padding:11px 10px;border-radius:var(--radius-sm);font-size:14px;
}
.drow:hover{background:var(--inset);}
.ditem .chev{color:var(--muted);display:inline-block;transition:transform .15s;}
.ditem.open .chev{transform:rotate(90deg);}
.d-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* an app's own metric: its label, then a small "app" mark that stays whole */
.d-name.custom{display:flex;align-items:center;gap:6px;min-width:0;}
.d-name.custom .d-label{overflow:hidden;text-overflow:ellipsis;}
.d-app{
  flex:none;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.4px;
  padding:1px 6px;border-radius:20px;color:var(--accent);background:var(--accent-soft);
}
.d-read{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);white-space:nowrap;}
.d-grain{font-size:12.5px;color:var(--muted);}
.dcap > *{font-size:inherit;color:inherit;}
/* not yet reporting: dimmed, but still opens */
.ditem.dim .drow > *{opacity:.55;}
.dgroup{
  display:flex;align-items:center;gap:10px;padding:16px 10px 6px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;
}
.dgroup::after{content:"";flex:1;height:1px;background:var(--border);}
.dgroup-count{font-size:10px;letter-spacing:.3px;color:var(--muted);font-weight:600;text-transform:none;}
/* a category's not-yet-reporting rows, folded behind one button */
.foldbtn{
  width:100%;border:none;background:none;color:var(--muted);text-align:left;
  display:flex;align-items:center;gap:8px;padding:11px 10px;font-size:13px;font-family:var(--font-body);
}
.foldbtn:hover{background:var(--inset);color:var(--ink);}
.foldbtn .chev{display:inline-block;transition:transform .15s;color:var(--muted);}
.foldbtn[aria-expanded="true"] .chev{transform:rotate(90deg);}
.foldbody[hidden]{display:none;}

/* continuity rhombuses - skewed like the tab strip.
   Fill opacity (--op) is the coverage; an outline alone means none. */
.rhs{display:flex;}
.rh-cell{width:34px;display:grid;place-items:center;text-align:center;}
.rh{
  width:20px;height:13px;transform:skewX(-14deg);border-radius:3px;
  border:1.5px solid var(--coverage);position:relative;overflow:hidden;
}
.rh::before{content:"";position:absolute;inset:0;background:var(--coverage);opacity:var(--op,0);}
.rh.none{border-color:var(--coverage-edge);}

/* expanded row: source priority on the left, the 5-week grid on the right */
.dpanel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 32px;padding:6px 10px 18px 38px;}
.dpanel h5{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}
.slist{display:flex;flex-direction:column;gap:6px;max-width:320px;}
.stile{
  display:flex;align-items:center;gap:10px;padding:8px 11px;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--inset);
  font-weight:600;font-size:13.5px;user-select:none;-webkit-user-select:none;
}
.stile .pill{margin-left:auto;}
.stile .grip{color:var(--muted);font-size:13px;letter-spacing:-2px;}
.slist.sortable .stile{cursor:grab;touch-action:none;}
.stile.dragging{border-color:var(--accent);background:var(--surface);box-shadow:var(--shadow);cursor:grabbing;}
.slist[aria-busy="true"]{opacity:.6;pointer-events:none;}
.dnote{font-size:12.5px;color:var(--muted);margin:10px 0 0;max-width:340px;}
/* under a source list: one of its sources is an uninstalled app's */
.orphan-src{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:10px;max-width:420px;}
.orphan-src .dnote{margin:0;}
.orphan-src code{font-family:var(--font-mono);font-size:12px;}
h5 + .dnote{margin-top:0;}

/* 5-week grid: 5 rows of 7 days ending today, labelled by each row's first day */
.wk{display:grid;grid-template-columns:auto repeat(7,18px);gap:4px;align-items:center;}
.wk .wl{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);padding-right:6px;white-space:nowrap;}
.wk .wd{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;}
.day{width:18px;height:18px;border-radius:4px;background:var(--coverage-off);}
.day.on{background:var(--coverage);}
.day.today{outline:1.5px solid var(--ink-2);outline-offset:1px;}

.dstate{padding:28px 10px 22px;text-align:center;color:var(--muted);font-size:13.5px;}

/* hover/focus tooltip for anything carrying data-tip */
.tip{
  position:fixed;z-index:90;pointer-events:none;max-width:260px;
  background:var(--ink);color:var(--bg);font-family:var(--font-mono);font-size:11px;line-height:1.4;
  padding:5px 9px;border-radius:7px;box-shadow:var(--shadow);
}

/* ---------- home: the sub-header ----------
   Under the tab strip: the subtitle on the left (text you set, an input
   while Configure is on) and the Configure toggle on the right, a tab
   like ＋ Add - dashed while off, the accent while on. */
.home-head{display:flex;align-items:center;gap:14px;min-height:40px;margin:0 0 14px;}
.home-sub{
  flex:1;min-width:0;margin:0;font-family:var(--font-display);font-weight:700;font-size:17px;
  color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.input.home-sub-input{flex:1;min-width:0;max-width:520px;padding:8px 11px;font-family:var(--font-display);font-weight:700;font-size:15px;}
.home-head .tab{top:0;flex:none;border-radius:7px;padding:9px 26px;}
.tab.home-cfg.active, .tab.home-cfg.active:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.tab.home-cfg:disabled{opacity:.5;cursor:not-allowed;}
.home-msg{margin:-6px 0 12px;}
.home-msg:empty{display:none;}

/* ---------- home: the installed apps' tiles ----------
   A grid six cells across. Each cell is square: Home's width over six,
   held between --tile-cell-min and --tile-cell-max - past the max the
   grid centres with margins; under the min it scrolls sideways (there's
   no phone layout yet). The tiles go in the layout's order, left to
   right, each spanning its size in cells; one too wide for what's left
   of a row starts the next, and the gap it leaves stays empty - row
   flow, never dense, so a later tile never backfills it. A resize only
   changes a cell's pixels: the layout never moves. A tile is chromeless,
   the app's spec its whole face, until Configure gives it a handle and a
   size picker. */
.home{container-type:inline-size;overflow-x:auto;padding:3px 3px 24px;}
.tiles{
  --tile-cell:clamp(var(--tile-cell-min), (100cqi - 5 * var(--tile-gap)) / 6, var(--tile-cell-max));
  display:grid;gap:var(--tile-gap);
  grid-template-columns:repeat(6, var(--tile-cell));
  grid-auto-rows:var(--tile-cell);
  grid-auto-flow:row;
  width:max-content;margin:0 auto;
}
.tile{
  position:relative;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 18px;min-width:0;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;
  /* the spec sizes its type to the tile (cqi units) */
  container-type:size;
}
/* Configure: the empty cells marked, a row of them under the tiles to
   drop one at the end, and every tile dashed, its face inert - the
   whole tile drags, all but its size picker */
.tiles.configuring{
  padding-bottom:calc(var(--tile-cell) + var(--tile-gap));
  background:conic-gradient(from 270deg at var(--tile-cell) var(--tile-cell), var(--tile-guide) 25%, transparent 0)
    0 0 / calc(var(--tile-cell) + var(--tile-gap)) calc(var(--tile-cell) + var(--tile-gap));
}
.tiles.configuring .tile{
  border-style:dashed;border-color:var(--border-strong);cursor:grab;padding-top:38px;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.tiles.configuring .tile > :not(.tile-cfg){pointer-events:none;}
.tiles.configuring .tile.dragging{
  border-style:solid;border-color:var(--accent);cursor:grabbing;z-index:2;
  box-shadow:0 0 0 2px var(--accent), var(--shadow);
}
.tiles[aria-busy="true"]{opacity:.6;pointer-events:none;}
/* a tile's controls, over its top edge: the handle and its settings
   gear, then the size picker and the move-to-tab picker, at the far end */
.tile-cfg{position:absolute;top:6px;left:6px;right:6px;display:flex;align-items:center;gap:6px;z-index:1;pointer-events:none;}
.tile-cfg > *{pointer-events:auto;}
.tile-grip{
  width:24px;height:24px;flex:none;padding:0;display:grid;place-items:center;cursor:grab;
  border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--muted);
}
.tile-grip:hover, .tile-grip:focus-visible{border-color:var(--accent);color:var(--accent);}
.tile-grip svg{width:8px;height:12px;fill:currentColor;}
/* its settings, when its app declares any: a gear beside the handle,
   clear of the pickers */
.tile-gear{
  width:24px;height:24px;flex:none;padding:0;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--muted);
}
.tile-gear:hover, .tile-gear:focus-visible{border-color:var(--accent);color:var(--accent);}
.tile-gear svg{width:12px;height:12px;fill:currentColor;}
.tile-size, .tile-move{
  min-width:0;padding:2px 4px;cursor:pointer;
  border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--ink);
  font-family:var(--font-mono);font-size:11.5px;
}
.tile-cfg > select:first-of-type{margin-left:auto;}
/* a select is as wide as its widest option: the size keeps its width,
   the move picker (tab names) takes what's left */
.tile-size{flex:none;}
.tile-size:focus, .tile-move:focus{border-color:var(--accent);outline:none;}
.tile > *{flex:1;min-height:0;}
/* number: a large value, its label beneath, a smaller muted caption */
.spec-number{display:flex;flex-direction:column;justify-content:center;min-width:0;}
.spec-panel > .spec-number{flex:none;}
.spec-number .v{
  font-family:var(--font-display);font-weight:800;line-height:1.05;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:40px;font-size:clamp(22px, 19cqi, 56px);
}
.spec-number .u{font-size:.42em;font-weight:600;color:var(--ink-2);margin-left:5px;letter-spacing:0;}
.spec-number .l{font-size:13.5px;font-weight:600;color:var(--ink-2);margin-top:5px;}
.spec-number .c{
  font-size:11.5px;font-family:var(--font-mono);color:var(--muted);margin-top:2px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
/* a short tile (a phone's 2x2): a panel keeps its caption to one line, so
   the line under it still has room */
@container (max-height:190px){
  .spec-panel{gap:8px;}
  .spec-panel .spec-number .c{-webkit-line-clamp:1;}
}
/* line: an optional title over a sparkline filling the rest, a dot on the latest point */
.spec-line{display:flex;flex-direction:column;gap:6px;min-height:28px;}
.spec-line .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}
.spec-line .plot{position:relative;flex:1;min-height:22px;}
.spec-line svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.spec-line polyline{fill:none;stroke:var(--spark);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;}
.spec-line .dot{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--spark);}
.spec-line .dot.end{width:8px;height:8px;margin:-4px 0 0 -4px;box-shadow:0 0 0 2px var(--surface);}
.spec-line .plot > .spec-msg{position:absolute;inset:0;}
/* timeline: one lane or two of time-blocks on one vertical time axis,
   under their headings, in a frame that scrolls it - a week to the
   frame's height (timelineSpec lays it out). Lane 0 left, in the lighter
   tone; lane 1 right, in the darker; the now line across both in the
   accent; a grey_after_now lane hatched grey from it down; a lane's
   bands - a trip away - tinted amber behind everything else in it, its
   port written where the band shows. The heading row keeps the same
   scrollbar gutter as the frame, so each heading sits over its lane. */
.spec-timeline{display:flex;flex-direction:column;gap:4px;min-height:0;min-width:0;}
.spec-panel > .spec-timeline{flex:1 1 0;}
.spec-timeline .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}
.tl-head, .tl-scroll{scrollbar-gutter:stable;scrollbar-width:thin;}
.tl-head{display:flex;overflow:hidden;padding:0 1px;}
.tl-lh{
  flex:1 1 0;min-width:0;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;
}
.tl-scroll{
  position:relative;flex:1 1 0;min-height:24px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--inset);
}
.tl-track{position:relative;width:100%;}
.tl-lane{position:absolute;top:0;bottom:0;}
.tl-lane + .tl-lane{border-left:1px solid var(--border);}
.tl-block{
  position:absolute;left:3px;right:3px;overflow:hidden;border-radius:4px;padding:1px 5px;
  font:600 11px/16px var(--font-mono);white-space:nowrap;text-overflow:ellipsis;
  /* a hairline of the frame between blocks a short duty's floor runs together */
  box-shadow:0 0 0 1px var(--inset);
}
.tl-lane.l0 .tl-block{background:var(--timeline-a);color:var(--timeline-a-ink);}
.tl-lane.l1 .tl-block{background:var(--timeline-b);color:var(--timeline-b-ink);}
/* a band: the lane's full width - so it shows either side of the blocks
   over it - first in the lane, so under its blocks, the grey and the
   lines; its label past the flight out, on the layover */
.tl-band{
  position:absolute;left:0;right:0;overflow:hidden;pointer-events:none;
  background:color-mix(in srgb,var(--layover) 14%,transparent);
  border-top:1px dashed color-mix(in srgb,var(--layover) 60%,transparent);
  border-bottom:1px dashed color-mix(in srgb,var(--layover) 60%,transparent);
}
.tl-band-label{
  position:absolute;left:5px;right:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font:600 10px/14px var(--font-mono);color:color-mix(in srgb,var(--layover) 80%,var(--ink));
}
.tl-future{
  position:absolute;left:0;right:0;bottom:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,
    color-mix(in srgb,var(--muted) 24%,transparent) 0 5px, color-mix(in srgb,var(--surface-2) 55%,transparent) 5px 10px);
}
.tl-now{position:absolute;left:0;right:0;height:0;margin-top:-1px;border-top:2px solid var(--accent);z-index:1;pointer-events:none;}
.tl-now::before{content:"";position:absolute;left:0;top:-4px;width:6px;height:6px;border-radius:50%;background:var(--accent);}
/* a synced timeline (spec.sync): a row over the headings - the time
   under the cursor, and a Now button once it's scrolled off now - and
   the frame wrapped (.tl-view) so the cursor, a fixed line across its
   middle, stays put while the track scrolls under it. The now line
   carries a Now tag, on the greyed lane, under the line. Both lines in
   the accent: they meet while the group follows now. */
.tl-focus{display:flex;align-items:center;gap:8px;min-height:20px;}
.tl-readout{font:600 11.5px/16px var(--font-mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.tl-focus .tl-nowbtn{flex:none;margin-left:auto;padding:1px 8px;font-size:11px;line-height:16px;}
.tl-focus .tl-nowbtn[hidden]{display:none;}
.tl-view{position:relative;display:flex;flex-direction:column;flex:1 1 0;min-height:24px;min-width:0;}
.tl-view > .tl-scroll{overflow-anchor:none;}
.tl-cursor{position:absolute;left:0;right:0;top:50%;height:0;margin-top:-1px;border-top:2px solid var(--accent);z-index:2;pointer-events:none;}
.tl-cursor::before, .tl-cursor::after{content:"";position:absolute;top:-5px;border:4px solid transparent;}
.tl-cursor::before{left:0;border-left:6px solid var(--accent);}
.tl-cursor::after{right:0;border-right:6px solid var(--accent);}
.tl-now-tag{
  position:absolute;top:3px;padding:0 5px;border-radius:4px;
  background:var(--accent);color:var(--accent-ink);font:700 9.5px/14px var(--font-body);text-transform:uppercase;letter-spacing:.6px;
}
/* panel: its children, stacked */
.spec-panel{display:flex;flex-direction:column;gap:12px;}
.spec-panel > .spec-line{flex:1;}
/* input: a label over a field, its unit and Save - at a panel's foot -
   and a refusal under them */
.spec-input{display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0;}
.spec-panel > .spec-input{flex:none;margin-top:auto;}
.spec-input .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;}
.spec-input .row{display:flex;align-items:center;gap:6px;min-width:0;}
.spec-input .input{
  flex:1 1 0;min-width:0;width:auto;padding:5px 8px;font-size:13px;font-variant-numeric:tabular-nums;
  appearance:textfield;-moz-appearance:textfield;
}
.spec-input .input::-webkit-inner-spin-button, .spec-input .input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
/* a select keeps its dropdown arrow, as the page's other selects do */
.spec-input select.input{appearance:auto;-moz-appearance:auto;}
/* a file picker: the browser's button, in the small buttons' style, and
   the file's name beside it - with Save wrapping under them, at the
   row's end, in a tile too narrow for all three */
.spec-input .row:has(> input[type="file"]){flex-wrap:wrap;}
.spec-input .row:has(> input[type="file"]) > .btn{margin-left:auto;}
.spec-input input[type="file"].input{flex:1 1 120px;padding:3px;font-size:12px;color:var(--ink-2);cursor:pointer;}
.spec-input input[type="file"].input::file-selector-button{
  margin-right:6px;padding:3px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--ink);font:600 12px var(--font-body);cursor:pointer;
}
.spec-input input[type="file"].input:hover::file-selector-button{border-color:var(--accent);color:var(--accent);}
.spec-input .u{font-size:12px;font-weight:600;color:var(--ink-2);}
.spec-input .btn{flex:none;padding:5px 9px;}
.spec-input .m{font-size:11px;font-family:var(--font-mono);color:var(--crit);overflow-wrap:anywhere;}
.spec-input .m:empty{display:none;}
/* empty and error: muted, centred */
.spec-msg{display:grid;place-content:center;gap:4px;text-align:center;color:var(--muted);font-size:13px;padding:4px;}
.spec-msg b{color:var(--ink-2);font-weight:600;font-size:13.5px;}
.spec-msg code{font-family:var(--font-mono);font-size:11px;overflow-wrap:anywhere;}
.home-state{padding:40px 10px;text-align:center;color:var(--muted);font-size:13.5px;}
.home-state .btn{margin-top:12px;}

/* ---------- responsive: the Data tab's columns ----------
   Any narrower and a column would be under ~580px, and a Your data row
   (chevron · name · reading · grain · continuity) would squeeze the
   metric's name to an ellipsis: one column instead, Applications below
   the data, at the width the console had before it split. */
@media (max-width:1240px){
  .console{grid-template-columns:minmax(0,1fr);max-width:940px;}
}
/* ---------- responsive: phone ---------- */
@media (max-width:860px){
  .topbar{padding:14px 15px 0;}
  .brand-name{font-size:20px;}
  .tabstrip{padding:14px 15px 0;gap:6px;}
  .tab{padding:10px 20px;font-size:12.5px;}
  .main{padding:18px 15px 60px;}
}
@media (max-width:640px){
  .dgrid{grid-template-columns:12px minmax(0,1fr) auto auto;column-gap:10px;}
  .d-grain, .d-gap{display:none;}
  .rh-cell{width:28px;}
  .dpanel, .dpanel.apanel{grid-template-columns:1fr;padding-left:10px;}
  .src{flex-wrap:wrap;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">Open<b>Fit</b></div>
    </div>
    <div class="status-stack">
      <div class="datepill" id="today"></div>
      <div class="bar-btns">
        <button class="bar-btn" id="settingsBtn" type="button">settings</button>
        <button class="bar-btn" id="themeToggle" type="button">theme <span id="themeState">auto</span></button>
      </div>
    </div>
  </header>

  <nav class="tabstrip" aria-label="Tabs">
    <!-- Home's tabs: the layout's, drawn by paintTabStrip() once it's
         read - until then, a stand-in for its first -->
    <div class="layout-tabs" id="layoutTabs">
      <button class="tab" data-tab="home" type="button"><span>Home</span></button>
    </div>
    <button class="tab tab-end active" data-tab="data" type="button" aria-current="page"><span>Data</span></button>
    <button class="tab tab-add" id="addTabBtn" type="button" aria-haspopup="dialog" hidden><span>＋ Add</span></button>
  </nav>

  <main class="main">
    <!-- HOME: the installed apps' tiles -->
    <section data-panel="home" aria-label="Home" hidden>
      <div class="home-head" id="homeHead"></div>
      <p class="form-msg home-msg" id="homeMsg" role="status"></p>
      <div class="home" id="home"></div>
    </section>
    <!-- DATA: the console -->
    <section data-panel="data" aria-label="Data">
      <div class="console">
        <div class="console-col">
          <section class="card" id="sourcesCard" aria-label="Connected sources"></section>
          <section class="card data" id="dataCard" aria-label="Your data"></section>
        </div>
        <div class="console-col">
          <section class="card" id="appsCard" aria-label="Applications"></section>
          <section class="card applist" id="appListCard" aria-label="Installed applications"></section>
        </div>
      </div>
    </section>
  </main>
  <!-- the voice buttons' one shared player (no controls, so never shown) -->
  <audio id="voice" preload="none"></audio>
</div>

<script>
(function(){
  "use strict";

  const $ = (s,r)=> (r||document).querySelector(s);
  const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
  const num = n => Number(n).toLocaleString();
  /* Anything that reaches innerHTML from the database (a plugin id, a
     source name) goes through here first. */
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const enc = encodeURIComponent;

  /* =========================================================
     API - the only place that knows about URLs
     ========================================================= */
  async function getJSON(url, fallback){
    try{ const r = await fetch(url); return r.ok ? await r.json() : fallback; }
    catch(e){ return fallback; }
  }
  /* The console's own reads. A failure here is shown, not papered over
     with an empty fallback that would read as "no data". */
  async function fetchJSON(url){
    const r = await fetch(url);
    if(!r.ok) throw new Error(url+' -> '+r.status);
    return r.json();
  }
  /* A POST whose reply is the thing asked for, not an {ok} envelope:
     a failure throws, as fetchJSON's does. */
  async function postJSON(url, body){
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error(url+' -> '+r.status);
    return r.json();
  }
  async function send(url, method, body){
    try{
      const r = await fetch(url, {
        method,
        headers: body!==undefined ? {'Content-Type':'application/json'} : undefined,
        body: body!==undefined ? JSON.stringify(body) : undefined,
      });
      const data = await r.json().catch(()=>({}));
      return r.ok ? Object.assign({ok:true}, data) : Object.assign({ok:false}, data);
    }catch(e){ return {ok:false, error:'network error'}; }
  }
  /* send()'s POST for a body of form fields and files (FormData): sent
     as multipart, its Content-Type - and the boundary in it - left to
     the browser to set. The same {ok, ...} reply. */
  async function sendForm(url, form){
    try{
      const r = await fetch(url, {method:'POST', body:form});
      const data = await r.json().catch(()=>({}));
      return r.ok ? Object.assign({ok:true}, data) : Object.assign({ok:false}, data);
    }catch(e){ return {ok:false, error:'network error'}; }
  }

  const api = {
    /* The access contract: what there is, which days hold it, and who
       is primary for each metric. */
    catalog:      ()             => fetchJSON('/api/catalog?include_empty=1'),
    coverage:     ()             => fetchJSON('/api/coverage'),
    sourceRoles:  ()             => fetchJSON('/api/source-roles'),
    setPrimary:   (metric, src)  => send('/api/source-roles/'+enc(metric), 'PUT', {primary:src}),
    sessions:     (kind, from)   => getJSON('/api/sessions/'+enc(kind)+(from ? '?from='+enc(from) : ''), null),
    /* Connectors = plugins + whatever account has been attached to them.
       Secrets go one way only: they are posted here and never read back,
       so nothing on this page can display a stored password. /detail
       returns the account's non-password login (an email), nothing more. */
    listConnectors:  ()            => getJSON('/api/connectors', []),
    connectorDetail: id            => fetchJSON('/api/connectors/'+enc(id)+'/detail'),
    /* hours: one of the presets, or null for the default */
    setConnectorCadence: (id, hours) => send('/api/connectors/'+enc(id)+'/cadence', 'PUT', {hours}),
    addConnector:    (id, values)  => send('/api/connectors/'+enc(id), 'POST', values),
    /* wipe also deletes everything the source wrote, and re-derives */
    removeConnector: (id, wipe)    => send('/api/connectors/'+enc(id)+(wipe ? '?wipe=1' : ''), 'DELETE'),
    /* OAuth connectors are added in two calls: start hands back a consent
       URL (and keeps the PKCE verifier server-side), finish takes the code
       the provider put in the address bar. Re-authenticating a connected
       one starts with {}: the server fills in its stored client details. */
    oauthStart:      (id, values)  => send('/api/connectors/'+enc(id)+'/oauth/start', 'POST', values),
    oauthFinish:     (id, code)    => send('/api/connectors/'+enc(id)+'/oauth/finish', 'POST', {code}),
    syncPlugin:   id             => send('/api/sync/'+enc(id)+'?days=7', 'POST'),
    /* The app host: the installed apps (each with its config schema),
       and one app's display spec, rendered with its instance's config -
       a POST only to carry the cfg; nothing is written. */
    apps:         ()             => fetchJSON('/api/apps'),
    renderApp:    (id, cfg)      => postJSON('/api/app/'+enc(id)+'/render', {cfg: cfg || {}}),
    /* An app acted on - its tile's input Saved: its handle() runs, and
       writes only under the app's own source. The reply is the app's
       spec, rendered afresh ({ok:true, spec}), or why not ({ok:false,
       error}), nothing written. */
    appAction:    (id, action, payload, cfg) =>
      send('/api/app/'+enc(id)+'/action', 'POST', {action, payload, cfg: cfg || {}}),
    /* The same for a file input: the action and the tile's config as
       form fields, and the file itself under the input's key - bytes
       don't fit JSON, so it goes multipart. The server keeps nothing of
       it: the app's handle() reads it, and what that writes stays. */
    appActionFile: (id, action, key, file, cfg) => {
      const form = new FormData();
      form.append('action', action);
      form.append('cfg', JSON.stringify(cfg || {}));
      form.append(key, file);
      return sendForm('/api/app/'+enc(id)+'/action', form);
    },
    /* Home's layout - its tabs, and on each the tiles' order and sizes
       and the subtitle over them - read reconciled with the apps
       installed now, and saved whole as Configure is switched off - or
       as a new app is put on the tab the Add popup picked. */
    homeLayout:   ()             => fetchJSON('/api/home-layout'),
    saveLayout:   layout         => send('/api/home-layout', 'PUT', layout),
    /* Install one from its files, {name: text}; the server reads the id
       from the app.yaml among them and re-checks everything. Updating
       one replaces its files with these, its id and data kept. */
    installApp:   files          => send('/api/apps', 'POST', {files}),
    updateApp:    (id, files)    => send('/api/apps/'+enc(id), 'PUT', {files}),
    /* One of an app's files, as text ({id, name, text}), for the viewer -
       a name /api/apps listed; and uninstalling one, folder and all. */
    appFile:      (id, name)     => send('/api/app/'+enc(id)+'/file?name='+enc(name), 'GET'),
    uninstallApp: id             => send('/api/apps/'+enc(id), 'DELETE'),
    /* What apps have written - each app's source, app:<id> - marked
       orphaned once its app is uninstalled (which keeps the data); and
       an orphan's data removed, all of it: its rows deleted, their days
       re-derived, any primary naming it cleared - or one metric of it,
       the rest left as it was. Refused while the app is installed. */
    appSources:      ()          => fetchJSON('/api/app-sources'),
    removeAppSource: id          => send('/api/app-sources/'+enc(id), 'DELETE'),
    removeAppSourceMetric: (id, metric) => send('/api/app-sources/'+enc(id)+'/'+enc(metric), 'DELETE'),
  };

  /* =========================================================
     NAMES - the catalog speaks in raw keys and source ids.
     Display names live here for now; they could move into the
     vocabulary (app/metrics.py) later. Anything unmapped still
     shows up, prettified.
     ========================================================= */
  const METRIC_NAMES = {
    steps:'Steps', resting_hr_bpm:'Resting HR', active_kcal:'Active calories',
    total_kcal:'Total calories', floors:'Floors', intensity_moderate_min:'Moderate intensity',
    intensity_vigorous_min:'Vigorous intensity', distance_m:'Distance', sleep_minutes:'Sleep duration',
    spo2_pct:'SpO₂ (daily)', respiratory_rate_brpm:'Respiration (daily)', hrv_ms:'HRV',
    vo2_max:'VO₂ max', body_fat_pct:'Body fat', bmi:'BMI', hydration_ml:'Hydration', weight_kg:'Weight',
    heart_rate:'Heart rate', respiration:'Respiration', spo2:'SpO₂',
    sleep:'Sleep', workout:'Workouts',
    duties_rostered:'Rostered duties', duties_complete:'Completed duties',
  };
  /* An app's own metric, app:<id>:<key>, is named by the label its app
     declares - the catalog's `label`, noted here as its rows are built
     (buildRows()) - else, its app uninstalled, by its short key. */
  const CUSTOM_LABELS = {};
  const titleCase = s => String(s||'').split(/[_\-\s]+/).filter(Boolean)
    .map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
  const metricName = key => METRIC_NAMES[key] || CUSTOM_LABELS[key] ||
    titleCase(String(key).replace(/^app:[^:]*:/, '').replace(/_(bpm|brpm|min|minutes|kcal|pct|ms|ml|kg|m|count)$/, '')) || key;
  /* "garmin" -> "Garmin", "google_health" -> "Google Health"; a pushed
     source ("eufy") reads the same way. */
  const srcName = id => titleCase(id) || 'Unknown';
  const UNIT_LABEL = {'kg/m2':'kg/m²'};
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';

  /* =========================================================
     STATE - all of it comes from the API. Nothing is seeded:
     a fresh install starts genuinely blank.
     ========================================================= */
  const state = {
    connectors:null,   // [{id, name, fields, add_flow, add_note, connected, configured}]; null until loaded
    appSources:null,   // /api/app-sources: [{id, source, orphaned, metrics, readings, sessions, samples}]
    status:'loading',  // the data card: loading | ready | error
    stale:false,       // a refresh failed; the last good load is still shown
    data:null,         // {rows, coverage, win}
    roles:{},          // /api/source-roles: {metric: {primary, configured, sources}}
    latest:{},         // session kind -> its latest session (for the Reading)
    sessionSources:{}, // session kind -> [source] | 'loading' | 'error' (fetched on expand)
    open:new Set(),    // ids of expanded rows - they stay open across a refresh
    foldOpen:new Set(),// categories whose not-yet-reporting fold is open - likewise
    note:{},           // row id -> {cls, text}: what the last priority change did
    orphanOpen:new Set(), // sources of the orphan rows open in Connected sources - likewise
  };

  /* ---------- dates ----------
     Coverage dates are plain YYYY-MM-DD; they are compared as whole
     days (UTC day numbers), so no time zone can shift one. */
  const DAY_MS = 864e5;
  const dayNum   = iso => Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10)) / DAY_MS;
  const isoOf    = n   => new Date(n*DAY_MS).toISOString().slice(0,10);
  const monthNum = iso => (+iso.slice(0,4))*12 + (+iso.slice(5,7)) - 1;
  const fmtDay   = iso => new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const fmtDayY  = iso => new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const fmtDayW  = iso => new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const weekday1 = iso => new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{weekday:'narrow'});
  /* A session start or sample ts (ISO, UTC), shown as the viewer's day. */
  const fmtStamp = s => { const d = new Date(s); return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
  const todayISO = () => {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  };

  /* =========================================================
     THE DATASET - catalog + coverage + source roles, one load
     ========================================================= */
  async function loadData(){
    if(!state.data){ state.status = 'loading'; paintData(); }
    try{
      const [catalog, coverage, roles] = await Promise.all([api.catalog(), api.coverage(), api.sourceRoles()]);
      state.latest = await latestSessions(catalog.sessions || []);
      state.data = {rows:buildRows(catalog), coverage, win:coverageWindow(coverage)};
      state.roles = roles || {};
      state.sessionSources = {};
      state.status = 'ready';
      state.stale = false;
    }catch(e){
      if(state.data) state.stale = true;
      else state.status = 'error';
    }
    paintData();
  }

  /* One row per catalog entry - metrics, then series, then sessions,
     each in the order the catalog lists them (vocabulary order; an
     installed app's own metrics after the canonical ones, each marked
     with its `app` and `label`). `cov` names the /api/coverage map its
     dates are in. */
  function buildRows(catalog){
    const rows = [];
    (catalog.metrics  || []).forEach(e => { if(e.app && e.label) CUSTOM_LABELS[e.metric] = e.label; });
    (catalog.metrics  || []).forEach(e => rows.push(Object.assign({}, e, {id:'metric:'+e.metric, key:e.metric, cov:'metrics'})));
    (catalog.series   || []).forEach(e => rows.push(Object.assign({}, e, {id:'series:'+e.metric, key:e.metric, cov:'series'})));
    (catalog.sessions || []).forEach(e => rows.push(Object.assign({}, e, {id:'session:'+e.kind, key:e.kind, cov:'sessions'})));
    return rows;
  }
  const datesOf = row => {
    const map = state.data && state.data.coverage && state.data.coverage[row.cov];
    const list = map && map[row.key];
    return Array.isArray(list) ? list : [];
  };

  /* For a session kind's Reading: its latest session, from the last day
     one started on (one small range read, not the whole history). */
  async function latestSessions(kinds){
    const out = {};
    await Promise.all(kinds.filter(k => k.count > 0 && k.last).map(async k => {
      const list = await api.sessions(k.kind, String(k.last).slice(0,10));
      // Listed by source priority, not by start: take the latest start.
      if(Array.isArray(list) && list.length) out[k.kind] = list.reduce((a, b) => b.start > a.start ? b : a);
    }));
    return out;
  }

  /* =========================================================
     CONTINUITY - source-agnostic, from /api/coverage.
     One window for every row, so the rows compare: the earliest
     date anything has, to today (no data at all: the last 90 days).
     ========================================================= */
  function coverageWindow(coverage){
    const end = dayNum(todayISO());
    let first = null;
    ['metrics','series','sessions'].forEach(g => Object.values((coverage||{})[g] || {}).forEach(list => {
      // Each list is ascending, so its first date is its earliest.
      if(Array.isArray(list) && list.length && (first===null || list[0] < first)) first = list[0];
    }));
    if(first===null) return {start:end-89, end, empty:true};
    return {start:Math.min(dayNum(first), end), end, empty:false};
  }

  /* daily   = distinct days with data / days in the window
     weekly  = 7-day buckets (from the window's start) with any / all buckets
     monthly = calendar months with any / months the window spans */
  function continuity(dates, win){
    const days = new Set(), weeks = new Set(), months = new Set();
    dates.forEach(iso => {
      const n = dayNum(iso);
      if(!(n >= win.start && n <= win.end)) return;   // outside the window (or unparseable)
      days.add(n);
      weeks.add(Math.floor((n - win.start) / 7));
      months.add(monthNum(iso));
    });
    const total = win.end - win.start + 1;
    return [
      {name:'Daily',   have:days.size,   of:total,                unit:'day'},
      {name:'Weekly',  have:weeks.size,  of:Math.ceil(total / 7), unit:'week'},
      {name:'Monthly', have:months.size, of:monthNum(isoOf(win.end)) - monthNum(isoOf(win.start)) + 1, unit:'month'},
    ];
  }
  const pct = f => (f > 0 && f < 0.01) ? '<1%' : Math.round(f*100) + '%';
  function rhombus(c){
    const frac = c.of ? c.have / c.of : 0;
    // 5% coverage or less reads as an outline, 95% or more as solid.
    const op = Math.min(1, Math.max(0, (frac - 0.05) / 0.90));
    const tip = `${c.name}: ${pct(frac)} · ${num(c.have)} of ${num(c.of)} ${c.unit}${c.of===1 ? '' : 's'}`;
    return `<span class="rh-cell" data-tip="${esc(tip)}"><span class="rh${c.have ? '' : ' none'}" style="--op:${op.toFixed(3)}"></span></span>`;
  }

  /* =========================================================
     READING - the latest value, in its unit
     ========================================================= */
  function fmtValue(v, unit){
    if(v==null || !isFinite(v)) return '—';
    const n = Number(v).toLocaleString(undefined, {maximumFractionDigits: Number.isInteger(Number(v)) ? 0 : 1});
    if(!unit || unit==='count') return n;
    if(unit==='%') return n + '%';
    return n + ' ' + (UNIT_LABEL[unit] || unit);
  }
  function fmtDuration(minutes){
    const t = Math.round(minutes), h = Math.floor(t / 60), m = t % 60;
    return h ? `${h}h ${m}m` : `${m}m`;
  }
  // Which summary field is a session kind's duration (app/metrics.py).
  const SESSION_MINUTES = {sleep:'asleep_minutes', workout:'duration_minutes'};

  function readingFor(row){
    if(!row.count) return {text:'—', tip:'Nothing reported yet'};
    // Every metric row - daily or instant grain - has a derived value.
    if(row.cov==='metrics'){
      return {text:fmtValue(row.last_value, row.unit), tip:'Latest · ' + fmtDayY(row.last_date)};
    }
    if(row.grain==='series'){
      return {text:num(row.count) + ' pts', tip:`${num(row.count)} samples · ${fmtStamp(row.first)} – ${fmtStamp(row.last)}`};
    }
    const sessions = `${num(row.count)} session${row.count===1 ? '' : 's'}`;
    const latest = state.latest[row.key];
    const minutes = latest && latest.summary && latest.summary[SESSION_MINUTES[row.key]];
    if(typeof minutes==='number' && isFinite(minutes)){
      return {text:fmtDuration(minutes), tip:`Latest · started ${fmtStamp(latest.start)} · ${sessions} in all`};
    }
    return {text:sessions, tip:'Latest started ' + fmtStamp(row.last)};
  }

  /* =========================================================
     THE DATA CARD
     ========================================================= */
  /* The rows are grouped by category, top to bottom in this order
     (CATEGORIES in app/metrics.py); one outside it would still be listed,
     after them by name, rather than dropped. Within a category, rows sort
     by grain in GRAIN_ORDER; ties keep the catalog's vocabulary order. */
  const CATEGORY_ORDER = [
    'Activity', 'Vitals', 'Body composition', 'Fitness', 'Sleep',
    'Nutrition & hydration', "Women's health", 'Roster', 'Other',
  ];
  const GRAIN_ORDER = {daily:0, instant:1, session:2, series:3};
  // An unknown grain sorts last. (daily is 0, so not `||`.)
  const grainRank = g => (g in GRAIN_ORDER) ? GRAIN_ORDER[g] : 9;

  function paintData(){
    const card = $('#dataCard');
    card.innerHTML = '';
    const head = el('div','card-head');
    head.appendChild(cardTitle('Your data', 'data'));
    card.appendChild(head);

    if(state.status==='loading'){
      card.appendChild(el('div','dstate','Loading your dataset…'));
      return;
    }
    if(state.status==='error'){
      const box = el('div','dstate',
        `Couldn't load the dataset.
         <div style="margin-top:12px;"><button class="btn sm" type="button">Try again</button></div>`);
      box.querySelector('button').onclick = loadData;
      card.appendChild(box);
      return;
    }

    const {rows} = state.data;
    if(state.stale) head.appendChild(el('div','form-msg bad', 'Couldn’t refresh - showing the last load.'));

    const list = el('div','dlist');
    list.appendChild(el('div','dcap dgrid',
      `<span></span><span>Metric</span><span>Reading</span><span class="d-grain">Grain</span><span class="d-gap"></span>
       <span class="rhs"><span class="rh-cell">Day</span><span class="rh-cell">Wk</span><span class="rh-cell">Mth</span></span>`));
    // Each category: its header, its reporting rows, then a fold of its
    // empty ones. A category with no rows at all gets no header.
    const present = Array.from(new Set(rows.map(r => r.category)));
    const order = CATEGORY_ORDER.concat(present.filter(c => !CATEGORY_ORDER.includes(c)).sort());
    order.forEach(cat => {
      const catRows = rows.filter(r => r.category===cat);
      if(!catRows.length) return;
      catRows.sort((a, b) => grainRank(a.grain) - grainRank(b.grain));   // stable
      const rep = catRows.filter(r => r.count > 0);
      const emp = catRows.filter(r => !r.count);
      list.appendChild(categoryHeader(cat, rep.length, emp.length));
      rep.forEach(r => list.appendChild(rowItem(r)));
      if(emp.length) list.appendChild(foldBlock(cat, emp));
    });
    card.appendChild(list);
  }

  function categoryHeader(cat, nRep, nEmp){
    return el('div','dgroup',
      `<span>${esc(cat)}</span>`
      + `<span class="dgroup-count">${nRep} reporting${nEmp ? ` · ${nEmp} empty` : ''}</span>`);
  }

  /* A category's not-yet-reporting rows, behind one button. It stays open
     across a refresh (state.foldOpen), and opens anyway while one of its
     rows is expanded, so an open row stays visible. */
  const foldId = cat => 'fold-' + cat.replace(/[^a-z0-9_-]/gi, '-');
  function foldBlock(cat, emp){
    const open = state.foldOpen.has(cat) || emp.some(r => state.open.has(r.id));
    const wrap = el('div','foldwrap');
    const btn = el('button','foldbtn',
      `<span class="chev" aria-hidden="true">›</span>${emp.length} not yet reporting in ${esc(cat)}`);
    btn.type = 'button';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-controls', foldId(cat));
    const body = el('div','foldbody');
    body.id = foldId(cat);
    body.hidden = !open;
    emp.forEach(r => body.appendChild(rowItem(r)));
    btn.onclick = () => {
      const nowOpen = body.hidden;
      body.hidden = !nowOpen;
      btn.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
      if(nowOpen){
        state.foldOpen.add(cat);
      }else{
        state.foldOpen.delete(cat);
        // Its rows close with it, or an open one would reopen it on refresh.
        if(emp.some(r => state.open.has(r.id))){
          emp.forEach(r => { state.open.delete(r.id); delete state.note[r.id]; });
          body.innerHTML = '';
          emp.forEach(r => body.appendChild(rowItem(r)));
        }
      }
    };
    wrap.appendChild(btn);
    wrap.appendChild(body);
    return wrap;
  }

  const panelId = row => 'panel-' + row.id.replace(/[^a-z0-9_-]/gi, '-');

  /* A row that opens a detail panel under its head: Your data's rows, and
     the Applications list's. Clicking the head (a button) shows or hides
     the panel and turns the chevron (.open). o.open is the Set of the ids
     open now, so a row repainted by a refresh comes back as it was;
     o.panel() builds the detail, with the id o.panelId; o.onClose, if
     given, runs as the row shuts. */
  function expandable(item, head, o){
    const isOpen = () => o.open.has(o.id);
    const reflect = () => {
      item.classList.toggle('open', isOpen());
      head.setAttribute('aria-expanded', isOpen() ? 'true' : 'false');
    };
    head.type = 'button';
    head.setAttribute('aria-controls', o.panelId);
    head.onclick = () => {
      if(isOpen()){
        o.open.delete(o.id);
        if(o.onClose) o.onClose();
        const p = Array.from(item.children).find(c => c.id===o.panelId); if(p) p.remove();
      }else{
        o.open.add(o.id);
        item.appendChild(o.panel());
      }
      reflect();
    };
    item.appendChild(head);
    if(isOpen()) item.appendChild(o.panel());
    reflect();
    return item;
  }

  function rowItem(row){
    const item = el('div', 'ditem' + (row.count ? '' : ' dim'));
    item.dataset.id = row.id;
    const read = readingFor(row);
    const cont = continuity(datesOf(row), state.data.win);
    const tip = row.key + (row.unit ? ' · ' + (UNIT_LABEL[row.unit] || row.unit) : '')
      + (row.app ? ` · defined by the app '${row.app}'` : '');
    // An app's own metric is marked as such beside its name.
    const name = row.app
      ? `<span class="d-name custom" data-tip="${esc(tip)}"><span class="d-label">${esc(metricName(row.key))}</span><span class="d-app">app</span></span>`
      : `<span class="d-name" data-tip="${esc(tip)}">${esc(metricName(row.key))}</span>`;
    const head = el('button','drow dgrid', `
      <span class="chev" aria-hidden="true">›</span>
      ${name}
      <span class="d-read tnum" data-tip="${esc(read.tip)}">${esc(read.text)}</span>
      <span class="d-grain">${esc(cap(row.grain))}</span>
      <span class="d-gap"></span>
      <span class="rhs" role="img" aria-label="${esc('Continuity: ' + cont.map(c => c.name.toLowerCase() + ' ' + pct(c.of ? c.have/c.of : 0)).join(', '))}">${cont.map(rhombus).join('')}</span>`);
    return expandable(item, head, {
      open:state.open, id:row.id, panelId:panelId(row),
      panel:() => panelFor(row),
      onClose:() => { delete state.note[row.id]; },
    });
  }

  function panelFor(row){
    const p = el('div','dpanel');
    p.id = panelId(row);
    const left = el('div', null, `<h5>${row.cov==='metrics' ? 'Source priority' : 'Sources'}</h5>`);
    fillSources(row, left);
    const right = el('div', null, '<h5>Last 5 weeks</h5>');
    right.appendChild(weekGrid(datesOf(row)));
    p.appendChild(left);
    p.appendChild(right);
    return p;
  }

  /* Rebuild one open row's panel in place - after a priority change, or
     when its session sources arrive. A closed row has nothing to repaint. */
  function repaintPanel(row, focusSrc){
    const old = document.getElementById(panelId(row));
    if(!old || !state.open.has(row.id)) return;
    const fresh = panelFor(row);
    old.replaceWith(fresh);
    if(focusSrc){
      const t = Array.from(fresh.querySelectorAll('.stile')).find(x => x.dataset.src===focusSrc);
      if(t) t.focus();
    }
  }

  /* ---------- the source list (expanded, left) ----------
     Metrics (daily or instant) have a pick, so their sources are a priority list -
     /api/source-roles, primary first, draggable. Series and sessions are
     a per-source passthrough with no pick yet: read-only. An app's own
     metric has one source, its app's, and no source role: its sources
     are the catalog's. */
  function fillSources(row, box){
    const note = text => box.appendChild(el('p','dnote', esc(text)));

    if(row.cov==='metrics'){
      const role = state.roles[row.key];
      const sources = role && Array.isArray(role.sources) ? role.sources
        : row.app ? (row.sources || []) : [];
      const sortable = !row.app && sources.length > 1;
      if(!sources.length){
        note(row.app ? `Defined by the app '${row.app}'. Nothing logged yet.` : 'No source is reporting this yet.');
      }
      else{
        const list = sourceList(sources, {primary:true, sortable});
        box.appendChild(list);
        if(sortable){
          makeSortable(list, (after, before, focusSrc) => commitPriority(row, list, after, before, focusSrc));
          note('Changing the primary source re-derives the dataset at the next sync.');
        }else if(row.app){
          note(`Defined by the app '${row.app}': only it writes this metric.`);
        }else{
          note(`${srcName(sources[0])} is the only source. Connect another to set a priority.`);
        }
        orphanLines(row, sources, box);
      }
    }else{
      let sources = row.grain==='series' ? (row.sources || []) : [];
      if(row.grain==='session' && row.count){
        const got = state.sessionSources[row.key];
        if(got===undefined || got==='loading'){
          if(got===undefined) loadSessionSources(row);
          note('Loading sources…');
          return;
        }
        if(got==='error'){ note('Couldn’t load the sources of these sessions.'); return; }
        sources = got;
      }
      if(!sources.length){ note('No source is reporting this yet.'); }
      else{
        box.appendChild(sourceList(sources, {}));
        note(row.grain==='series'
          ? 'Series are passed through per source - there’s no pick between sources yet, so no priority to set.'
          : 'Sessions are listed per source - there’s no pick between sources yet, so no priority to set.');
        orphanLines(row, sources, box);
      }
    }

    const msg = state.note[row.id];
    if(msg) box.appendChild(el('div','form-msg ' + msg.cls, esc(msg.text)));
  }

  function sourceList(sources, opts){
    const list = el('div','slist' + (opts.sortable ? ' sortable' : ''));
    list.setAttribute('role','list');
    sources.forEach((id, i) => {
      const t = el('div','stile',
        (opts.sortable ? '<span class="grip" aria-hidden="true">⋮⋮</span>' : '') +
        `<span>${esc(srcName(id))}</span>` +
        (opts.primary && i===0 ? '<span class="pill primary">PRIMARY</span>' : ''));
      t.dataset.src = id;   // the source id travels with the tile
      t.setAttribute('role','listitem');
      if(opts.sortable){
        t.tabIndex = 0;
        t.setAttribute('aria-label', `${srcName(id)}. Drag, or use the up and down arrow keys, to reorder.`);
      }
      list.appendChild(t);
    });
    return list;
  }

  /* Any of a row's sources an uninstalled app left behind: a line under
     the list naming it, with Remove data - Connected sources' confirm,
     for this row's metric only: the app's other data stays. A live
     app's source, like a device's, has none. */
  function orphanLines(row, sources, box){
    sources.forEach(src => {
      const o = orphans().find(x => x.source === src);
      if(!o) return;
      const line = el('div','orphan-src', `
        <span class="dnote"><code></code> is from an uninstalled app.</span>
        <button class="btn sm danger" type="button" data-act="remove-data" aria-haspopup="dialog">Remove data</button>`);
      line.querySelector('code').textContent = o.source;
      line.querySelector('[data-act="remove-data"]').onclick = () => openRemoveAppData(o, row.key);
      box.appendChild(line);
    });
  }

  /* Drag to reorder, with a pointer (mouse, pen or touch) or the arrow
     keys. The PRIMARY pill follows whichever tile is on top. onCommit
     gets the new order and the one before it. */
  function makeSortable(list, onCommit){
    const order = () => Array.from(list.children).map(t => t.dataset.src);
    const relabel = () => Array.from(list.children).forEach((t, i) => {
      const pill = t.querySelector('.pill');
      if(i===0 && !pill) t.insertAdjacentHTML('beforeend', '<span class="pill primary">PRIMARY</span>');
      if(i>0 && pill) pill.remove();
    });
    let drag = null;

    list.addEventListener('pointerdown', e => {
      const tile = e.target.closest('.stile');
      if(!tile || e.button!==0 || list.getAttribute('aria-busy')==='true') return;
      drag = {tile, id:e.pointerId, before:order()};
      list.setPointerCapture(e.pointerId);
      tile.classList.add('dragging');
      hideTip();
      e.preventDefault();
    });
    list.addEventListener('pointermove', e => {
      if(!drag || e.pointerId!==drag.id) return;
      const next = Array.from(list.children).find(t =>
        t!==drag.tile && e.clientY < t.getBoundingClientRect().top + t.offsetHeight/2);
      if(next ? drag.tile.nextElementSibling!==next : list.lastElementChild!==drag.tile){
        list.insertBefore(drag.tile, next || null);
        relabel();
      }
    });
    const end = e => {
      if(!drag || e.pointerId!==drag.id) return;
      const {tile, before} = drag;
      drag = null;
      tile.classList.remove('dragging');
      const after = order();
      if(after.join('\n')!==before.join('\n')) onCommit(after, before);
    };
    list.addEventListener('pointerup', end);
    list.addEventListener('pointercancel', end);

    list.addEventListener('keydown', e => {
      const tile = e.target.closest('.stile');
      if(!tile || (e.key!=='ArrowUp' && e.key!=='ArrowDown')) return;
      e.preventDefault();
      if(list.getAttribute('aria-busy')==='true') return;
      const before = order();
      if(e.key==='ArrowUp' && tile.previousElementSibling) list.insertBefore(tile, tile.previousElementSibling);
      else if(e.key==='ArrowDown' && tile.nextElementSibling) list.insertBefore(tile.nextElementSibling, tile);
      else return;
      relabel();
      tile.focus();
      onCommit(order(), before, tile.dataset.src);
    });
  }

  /* Only the primary is configurable (PUT /api/source-roles/<metric>);
     every source below it keeps OpenFit's default order. So a drop that
     changes the top saves it, and one that doesn't snaps back. */
  async function commitPriority(row, list, after, before, focusSrc){
    if(after[0]===before[0]){
      state.note[row.id] = {cls:'info', text:'Only the primary is yours to set - the sources below it keep OpenFit’s default order.'};
      repaintPanel(row, focusSrc);
      return;
    }
    list.setAttribute('aria-busy','true');
    const res = await api.setPrimary(row.key, after[0]);
    if(!res.ok){
      // Repainting from state.roles puts the order back as it was.
      state.note[row.id] = {cls:'bad', text:res.error || 'Could not change the primary source.'};
      repaintPanel(row, focusSrc);
      return;
    }
    try{ state.roles = await api.sourceRoles(); }
    catch(e){
      const role = state.roles[row.key] || {};
      state.roles[row.key] = Object.assign({}, role, {primary:after[0], configured:true, sources:after});
    }
    state.note[row.id] = {cls:'ok', text:`Saved - ${srcName(after[0])} is now the primary source.`};
    repaintPanel(row, focusSrc);
  }

  /* A session kind's sources aren't in the catalog: read its sessions
     once, on first expand, and list who reported them (most first). */
  async function loadSessionSources(row){
    state.sessionSources[row.key] = 'loading';
    const list = await api.sessions(row.key);
    if(!Array.isArray(list)){
      state.sessionSources[row.key] = 'error';
    }else{
      const counts = {};
      list.forEach(s => { counts[s.source] = (counts[s.source] || 0) + 1; });
      state.sessionSources[row.key] = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
    }
    repaintPanel(row);
  }

  /* ---------- the 5-week grid (expanded, right) ----------
     The 35 days ending today, 7 to a row; a day is on if any source has
     data for it. Binary and source-agnostic, like the rhombuses. */
  function weekGrid(dates){
    const have = new Set(dates);
    const end = dayNum(todayISO()), start = end - 34;
    let on = 0;
    let html = '<span></span>';
    for(let i = 0; i < 7; i++) html += `<span class="wd">${esc(weekday1(isoOf(start + i)))}</span>`;
    for(let r = 0; r < 5; r++){
      const first = start + r*7;
      html += `<span class="wl">${esc(fmtDay(isoOf(first)))}</span>`;
      for(let i = 0; i < 7; i++){
        const iso = isoOf(first + i);
        const hit = have.has(iso);
        if(hit) on++;
        html += `<span class="day${hit ? ' on' : ''}${first + i===end ? ' today' : ''}" data-tip="${esc(fmtDayW(iso) + (hit ? ' · data' : ' · no data'))}"></span>`;
      }
    }
    const g = el('div','wk', html);
    g.setAttribute('role','img');
    g.setAttribute('aria-label', `${on} of the last 35 days have data`);
    return g;
  }

  /* =========================================================
     TOOLTIP - one shared bubble for anything with data-tip
     ========================================================= */

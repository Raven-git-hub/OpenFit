     the Add popup's picker chose. The server's read has already given it
     an instance on the default tab (every installed app has one), so the
     layout is read, that instance - id, size, config - lifted onto the
     end of the chosen tab, and the layout saved. The default chosen,
     nothing to do; a read or save that fails leaves it on the default,
     as before the picker. */
  async function placeNewAppOnTab(appId, tabId){
    let layout;
    try{ layout = await api.homeLayout(); }
    catch(e){ return; }
    if(!layout || !Array.isArray(layout.tabs) || tabId === layout.default_tab) return;
    const to = layout.tabs.find(t => t.id === tabId);
    if(!to) return;
    let inst = null;
    for(const tab of layout.tabs){
      const i = tab.items.findIndex(it => it.app_id === appId);
      if(i >= 0){ inst = tab.items.splice(i, 1)[0]; break; }
    }
    if(!inst) return;
    to.items.push(inst);
    await api.saveLayout(layout);
  }

  /* ---- Configure: a tile's controls ---- */
  const GRIP = '<svg viewBox="0 0 8 12" aria-hidden="true"><circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/><circle cx="2" cy="6" r="1.2"/><circle cx="6" cy="6" r="1.2"/><circle cx="2" cy="10" r="1.2"/><circle cx="6" cy="10" r="1.2"/></svg>';
  /* Its handle - drag the tile, or step it with the arrow keys - then,
     when its app declares config fields, a gear opening its settings
     (openTileConfig). Then, when its app offers more than one size, a
     picker of those sizes: choosing one resizes the tile, and the grid
     reflows round it. Then, when there's another tab, a picker of them:
     choosing one moves the tile there (moveTile). */
  function tileControls(t, tile){
    const name = t.name || t.app_id;
    const bar = el('div','tile-cfg');
    const grip = el('button','tile-grip', GRIP);
    grip.type = 'button';
    grip.setAttribute('aria-label', 'Move '+name+': drag it, or use the arrow keys');
    grip.title = 'Drag to move, or use the arrow keys';
    bar.appendChild(grip);
    if(configFields(t.app_id).length){
      const gear = el('button','tile-gear', GEAR);
      gear.type = 'button';
      gear.title = 'Settings';
      gear.setAttribute('aria-label', 'Settings of '+name);
      gear.setAttribute('aria-haspopup','dialog');
      gear.onclick = () => openTileConfig(t);
      bar.appendChild(gear);
    }
    if(t.sizes.length > 1){
      const pick = el('select','tile-size');
      pick.setAttribute('aria-label', 'Size of '+name);
      t.sizes.forEach((s, i) => {
        const o = el('option');
        o.value = String(i);
        o.textContent = s.w+' × '+s.h;
        o.selected = s.w===t.w && s.h===t.h;
        pick.appendChild(o);
      });
      pick.onchange = () => {
        const s = t.sizes[+pick.value];
        t.w = s.w; t.h = s.h;
        spanTile(tile, t);
      };
      bar.appendChild(pick);
    }
    // Not to a tab that has the app already (a layout saved from
    // elsewhere can place it twice): a move, never a merge.
    const targets = home.layout.tabs.filter(tab =>
      tab.id!==home.activeTab && !tab.items.some(it => it.app_id===t.app_id));
    if(targets.length){
      const move = el('select','tile-move');
      move.setAttribute('aria-label', 'Move '+name+' to another tab');
      move.title = 'Move to another tab';
      const hint = el('option');
      hint.value = '';
      hint.textContent = 'Move…';
      hint.disabled = true;
      hint.selected = true;
      move.appendChild(hint);
      targets.forEach(tab => {
        const o = el('option');
        o.value = tab.id;
        o.textContent = tab.name;
        move.appendChild(o);
      });
      move.onchange = () => moveTile(t.app_id, move.value);
      bar.appendChild(move);
    }
    return bar;
  }

  /* A tile's settings, from its gear: a form of its app's config fields,
     in the manifest's order, each filled with the instance's value, else
     the field's default. A number field is a numeric input; any other
     type, text (richer types are to come). Save puts the values into the
     instance's config - a number as a number, back to the default when
     blank or not one; text as typed; a key the form doesn't show kept -
     and re-renders the tile with them, in place. The config goes to the
     server with the rest of the layout as Configure is switched off.
     Labels are escaped; values set as .value, never markup. */
  function openTileConfig(t){
    const fields = configFields(t.app_id);
    const numeric = f => f.type==='number';
    const {box, close} = openModal(`
      <h4>${esc(t.name || t.app_id)} settings</h4>
      <p class="hint">Saved with the layout as you switch Configure off.</p>
      ${fields.map((f, i) => `
      <div class="field">
        <label for="tileCfg${i}">${esc(f.label || f.key)}</label>
        <input class="input" id="tileCfg${i}" ${numeric(f) ? 'type="number" step="any"' : 'type="text"'} autocomplete="off">
      </div>`).join('')}
      <div class="modal-actions">
        <button class="btn sm" data-act="close" type="button">Cancel</button>
        <button class="btn sm primary" data-act="save" type="button">Save</button>
      </div>`);
    const inputs = fields.map((f, i) => box.querySelector('#tileCfg'+i));
    const cfg = t.config || {};
    fields.forEach((f, i) => {
      const v = Object.prototype.hasOwnProperty.call(cfg, f.key) ? cfg[f.key] : f.default;
      inputs[i].value = v==null ? '' : String(v);
    });
    const save = () => {
      const next = Object.assign({}, cfg);
      fields.forEach((f, i) => {
        let v = inputs[i].value;
        if(numeric(f)){
          const n = Number(v);
          v = String(v).trim()!=='' && Number.isFinite(n) ? n : f.default;
        }
        if(v===undefined) delete next[f.key];
        else next[f.key] = v;
      });
      close();
      t.config = next;
      // Drawn unless it's been set again since (a later Save's render wins).
      api.renderApp(t.app_id, next)
        .catch(() => ({type:'error', message:"Couldn't load this app."}))
        .then(spec => { if(t.config===next) repaintTile(t.app_id, spec); });
    };
    inputs.forEach(input => { input.onkeydown = e => { if(e.key==='Enter') save(); }; });
    box.querySelector('[data-act="save"]').onclick = save;
    box.querySelector('[data-act="close"]').onclick = close;
    if(inputs.length) inputs[0].focus();
  }

  /* ---- Configure: tabs, and moving a tile to one ----
     All of it edits the working copy, home.layout: nothing is saved
     until Configure is switched off, and then all of it at once. */

  /* A tile moved to another tab: its instance - id, size, config - goes
     on the end of that tab, and the tile leaves this one's grid. A move,
     never a copy: the app is still on one tab. */
  function moveTile(appId, tabId){
    flushTab();
    const tabs = home.layout.tabs;
    const from = tabs.find(t => t.id===home.activeTab), to = tabs.find(t => t.id===tabId);
    const i = from ? from.items.findIndex(it => it.app_id===appId) : -1;
    if(!to || to===from || i < 0) return;
    to.items.push(from.items.splice(i, 1)[0]);
    renderActiveTab();
  }

  /* A new tab, empty, on the end of the strip, and shown. Its id is
     minted here - the page needs it at once - and the server takes it
     as given. */
  function createTab(name){
    const id = newTabId(home.layout.tabs.map(t => t.id));
    home.layout.tabs.push({id, name, mode:'flow', subtitle:'', items:[]});
    switchTab(id);
  }
  function renameTab(id, name){
    const tab = home.layout.tabs.find(t => t.id===id);
    if(!tab) return;
    tab.name = name;
    paintTabStrip();
  }

  /* Where a deleted tab's tiles go: the default tab - or, the default
     itself deleted, the first tab left, the new default. */
  function deleteTarget(id){
    const left = home.layout.tabs.filter(t => t.id!==id);
    return left.find(t => t.id===home.layout.default_tab) || left[0];
  }
  /* A tab deleted: its instances - ids, sizes, configs - go on the end
     of deleteTarget(), so nothing is uninstalled and every app is still
     on a tab. Home shows that tab if it showed this one. The only tab
     can't go: Home has at least one. */
  function deleteTab(id){
    const tabs = home.layout.tabs;
    const i = tabs.findIndex(t => t.id===id);
    if(i < 0 || tabs.length < 2) return;
    flushTab();
    const dest = deleteTarget(id);
    const gone = tabs.splice(i, 1)[0];
    home.layout.default_tab = dest.id;
    dest.items.push(...gone.items);
    if(home.activeTab===id) home.activeTab = dest.id;
    renderActiveTab();
  }

  /* A new tab's id: eight lowercase letters and digits - the server's
     TAB_ID - none of `taken`. */
  function newTabId(taken){
    for(;;){
      let id = '';
      while(id.length < 8) id += Math.floor(Math.random()*36).toString(36);
      if(!taken.includes(id)) return id;
    }
  }

  /* Why a tab can't have this name, or null - the server's rule: not
     blank, at most TAB_NAME_MAX characters (as Python counts them, by
     code point). */
  function tabNameProblem(name){
    if(typeof name!=='string' || !name.trim()) return 'A tab needs a name.';
    if([...name].length > TAB_NAME_MAX) return `A tab's name can be at most ${TAB_NAME_MAX} characters.`;
    return null;
  }

  /* ＋ Add's popup (tab null): a name, then Create. A tab's gear (its
     settings): its name, to rename it, and - unless it's the only tab -
     Delete tab, behind a confirm saying where its tiles go. The name is
     checked here (tabNameProblem) before anything changes, trimmed, and
     set as text, never markup; the server checks it again on the save. */
  function openTabEditor(tab){
    const canDelete = !!tab && home.layout.tabs.length > 1;
    const {box, close} = openModal(`
      <h4>${tab ? 'Tab settings' : 'New tab'}</h4>
      <div data-step="name">
        <div class="field">
          <label for="tabName">Name</label>
          <input class="input" id="tabName" type="text" maxlength="${TAB_NAME_MAX}" autocomplete="off">
        </div>
        <div class="form-msg bad src-msg" data-f="msg"></div>
        <div class="modal-actions">
          ${canDelete ? '<button class="btn sm danger lead" data-act="delete" type="button">Delete tab</button>' : ''}
          <button class="btn sm" data-act="close" type="button">Cancel</button>
          <button class="btn sm primary" data-act="save" type="button">${tab ? 'Save' : 'Create'}</button>
        </div>
      </div>
      <div data-step="delete" hidden>
        <div class="danger-panel">
          <h5>Delete this tab?</h5>
          <p data-f="confirm"></p>
          <div class="modal-actions">
            <button class="btn sm" data-act="back" type="button">Cancel</button>
            <button class="btn sm danger solid" data-act="confirm" type="button">Delete tab</button>
          </div>
        </div>
      </div>`);
    const input = box.querySelector('#tabName');
    const msg = box.querySelector('[data-f="msg"]');
    const step = name => {
      box.querySelectorAll('[data-step]').forEach(s => { s.hidden = s.dataset.step!==name; });
      (name==='name' ? input : box.querySelector('[data-act="back"]')).focus();
    };
    input.value = tab ? tab.name : '';
    input.oninput = () => { msg.textContent = ''; };
    const save = () => {
      const name = input.value.trim();
      const problem = tabNameProblem(name);
      if(problem){ msg.textContent = problem; input.focus(); return; }
      close();
      if(tab) renameTab(tab.id, name);
      else createTab(name);
    };
    input.onkeydown = e => { if(e.key==='Enter') save(); };
    box.querySelector('[data-act="save"]').onclick = save;
    box.querySelector('[data-act="close"]').onclick = close;
    if(canDelete){
      box.querySelector('[data-act="delete"]').onclick = () => {
        // The tab on screen's tiles are the live ones.
        const n = tab.id===home.activeTab ? home.tiles.length : tab.items.length;
        box.querySelector('[data-f="confirm"]').textContent = n
          ? `“${tab.name}” goes, and its ${n===1 ? 'tile moves' : n+' tiles move'} to “${deleteTarget(tab.id).name}”. Nothing is uninstalled.`
          : `“${tab.name}” goes. There's nothing on it.`;
        step('delete');
      };
      box.querySelector('[data-act="back"]').onclick = () => step('name');
      box.querySelector('[data-act="confirm"]').onclick = () => { close(); deleteTab(tab.id); };
    }
    input.focus();
  }

  /* ---- Configure: reorder ----
     A sortable list, not a placement: drag a tile (anywhere but its
     pickers and its gear) onto another and it takes that one's place in
     the order, the rest reflowing live to show where it will land; the
     drop keeps it there. Into the gap at a row's end, it goes after that
     row's last tile; under them all, into the drop row, last. A handle's
     arrow keys step its tile back (←, ↑) or on (→, ↓). home.tiles
     follows the order on every drop or step. */
  function sortableTiles(grid){
    const syncOrder = () => {
      const order = Array.from(grid.children).map(t => t.dataset.app);
      home.tiles.sort((a, b) => order.indexOf(a.app_id) - order.indexOf(b.app_id));
    };
    let drag = null;
    // How far the pointer goes after one reorder before another: tiles of
    // different sizes reflow under it, and it mustn't chase them.
    const SETTLE = 12;

    grid.addEventListener('pointerdown', e => {
      const tile = e.target.closest('.tile');
      if(!tile || e.button!==0 || e.target.closest('select, .tile-gear') || home.saving) return;
      drag = {tile, id:e.pointerId, x:e.clientX, y:e.clientY, moving:false, last:null, at:null};
      grid.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    grid.addEventListener('pointermove', e => {
      if(!drag || e.pointerId!==drag.id) return;
      if(!drag.moving){
        // A press that hasn't gone anywhere is a click, not a drag.
        if(Math.abs(e.clientX-drag.x) + Math.abs(e.clientY-drag.y) < 6) return;
        drag.moving = true;
        drag.tile.classList.add('dragging');
        hideTip();
      }
      // Near the window's top or bottom edge, the page scrolls along.
      if(e.clientY < 40) window.scrollBy(0, -16);
      else if(e.clientY > window.innerHeight - 40) window.scrollBy(0, 16);
      if(drag.at && Math.abs(e.clientX-drag.at.x) + Math.abs(e.clientY-drag.at.y) < SETTLE) return;
      const spot = dropSpot(grid, drag.tile, e.clientX, e.clientY);
      // Once per spot, so a reflow that slides a tile under the pointer
      // doesn't bounce the dragged one back.
      if(!spot || spot.key===drag.last) return;
      drag.last = spot.key;
      if(spot.before===drag.tile.nextElementSibling) return;
      grid.insertBefore(drag.tile, spot.before);
      drag.at = {x:e.clientX, y:e.clientY};
    });
    const end = e => {
      if(!drag || e.pointerId!==drag.id) return;
      const {tile, moving} = drag;
      drag = null;
      tile.classList.remove('dragging');
      if(moving) syncOrder();
    };
    grid.addEventListener('pointerup', end);
    grid.addEventListener('pointercancel', end);

    grid.addEventListener('keydown', e => {
      const grip = e.target.closest('.tile-grip');
      const back = e.key==='ArrowLeft' || e.key==='ArrowUp';
      const on = e.key==='ArrowRight' || e.key==='ArrowDown';
      if(!grip || (!back && !on)) return;
      e.preventDefault();
      if(home.saving) return;
      const tile = grip.closest('.tile');
      if(back && tile.previousElementSibling) grid.insertBefore(tile, tile.previousElementSibling);
      else if(on && tile.nextElementSibling) grid.insertBefore(tile.nextElementSibling, tile);
      else return;
      syncOrder();
      grip.focus();
    });
  }

  /* Where the dragged tile lands with the pointer at x, y: {before, key},
     before the tile it goes in front of (null: last) and key naming the
     spot - or null, to stay put (over itself, or a gap with no row). */
  function dropSpot(grid, dragged, x, y){
    const tiles = Array.from(grid.children);
    const box = t => t.getBoundingClientRect();
    // The tile after t, the dragged one aside: what "after t" goes before.
    const after = t => { const n = t.nextElementSibling; return n===dragged ? n.nextElementSibling : n; };
    const over = tiles.find(t => { const r = box(t); return x>=r.left && x<r.right && y>=r.top && y<r.bottom; });
    if(over===dragged) return null;
    if(over){
      // Its place: coming from earlier in the order, the dragged tile
      // goes after it; from later, before it.
      const forward = tiles.indexOf(dragged) < tiles.indexOf(over);
      return {before: forward ? after(over) : over, key: over.dataset.app};
    }
    if(y >= Math.max(...tiles.map(t => box(t).bottom))) return {before:null, key:':end'};
    const beside = tiles.filter(t => { const r = box(t); return t!==dragged && y>=r.top && y<r.bottom && x>=r.right; });
    if(!beside.length) return null;
    const last = beside[beside.length-1];
    return {before:after(last), key:':gap:' + last.dataset.app};
  }

  /* ---- spec -> DOM: the display vocabulary ----
     Everything an app sends is set as text, never as markup. A spec is
     drawn for its app (name, appId): an input acts on it. */
  const SPECS = {
    number: s => {
      const box = el('div','spec-number');
      const v = el('div','v');
      v.textContent = fmtSpecValue(s.value);
      if(s.unit!=null && s.unit!==''){ const u = el('span','u'); u.textContent = s.unit; v.appendChild(u); }
      box.appendChild(v);
      if(s.label!=null && s.label!==''){ const l = el('div','l'); l.textContent = s.label; box.appendChild(l); }
      if(s.caption!=null && s.caption!==''){
        // Clamped to fit the tile, so the whole of it is on hover.
        const c = el('div','c'); c.textContent = s.caption; c.title = String(s.caption); box.appendChild(c);
      }
      return box;
    },
    line: s => sparkline(Array.isArray(s.points) ? s.points : [], s.title),
    panel: (s, name, appId) => {
      const box = el('div','spec-panel');
      (Array.isArray(s.children) ? s.children : []).forEach(c => box.appendChild(renderSpec(c, name, appId)));
      return box;
    },
    input: (s, name, appId) => specInput(s, appId),
    timeline: s => timelineSpec(s),
    empty: s => specMsg(null, s.message || 'No data yet'),
    error: (s, name) => specMsg("Couldn't render "+(name || 'this app'), s.message),
  };
  function renderSpec(spec, name, appId){
    const type = spec && typeof spec==='object' ? spec.type : null;
    return Object.prototype.hasOwnProperty.call(SPECS, type)
      ? SPECS[type](spec, name, appId)
      : specMsg("Couldn't render "+(name || 'this app'), 'Unknown spec type: '+type);
  }
  const fmtSpecValue = v => v==null ? '—'
    : typeof v==='number' ? (Number.isFinite(v) ? v.toLocaleString() : '—')
    : String(v);
  const UPLOAD_MAX = 25 * 1024 * 1024;   // the server's MAX_UPLOAD_BYTES (main.py)
  /* input: a field under its label, its unit and Save beside it. Save
     (or Enter) sends the app its action, the payload {key: what was
     entered} - a number, for kind "number"; for "select", the option
     chosen from a dropdown of s.options, as written; for "file", the
     file picked (Save only), offered by s.accept's hints - with the
     tile's config; the app's fresh spec redraws the tile, and a refusal
     shows under the field, kept as entered. Nothing is sent from a tile
     drawn for no app, for a select with no option chosen yet, or for a
     file picker with no file picked, or one over UPLOAD_MAX. */
  function specInput(s, appId){
    const box = el('div','spec-input');
    const label = s.label!=null && s.label!=='' ? String(s.label) : '';
    if(label){ const l = el('div','t'); l.textContent = label; box.appendChild(l); }
    const row = el('div','row');
    const choice = s.kind==='select';
    const upload = s.kind==='file';
    const field = el(choice ? 'select' : 'input','input');
    const numeric = !choice && !upload && s.kind!=='text';
    if(choice){
      // A placeholder first, which can't be chosen back: nothing is
      // picked until the user picks it, so a log is always deliberate.
      const none = el('option');
      none.value = '';
      none.textContent = 'Choose…';
      none.disabled = none.selected = true;
      field.appendChild(none);
      (Array.isArray(s.options) ? s.options : []).forEach(v => {
        const o = el('option');
        o.value = o.textContent = String(v);
        field.appendChild(o);
      });
    }else if(upload){
      // The browser's own picker; the hints, if any, only steer it.
      field.type = 'file';
      if(s.accept!=null && s.accept!=='') field.accept = String(s.accept);
    }else{
      field.type = numeric ? 'number' : 'text';
      if(numeric){ field.step = 'any'; field.inputMode = 'decimal'; }
    }
    field.setAttribute('aria-label', label || String(s.key));
    row.appendChild(field);
    if(s.unit!=null && s.unit!==''){ const u = el('span','u'); u.textContent = s.unit; row.appendChild(u); }
    const save = el('button','btn sm');
    save.type = 'button';
    save.textContent = 'Save';
    save.disabled = !appId;
    row.appendChild(save);
    box.appendChild(row);
    const msg = el('div','m');
    msg.setAttribute('role','status');
    box.appendChild(msg);
    const submit = async () => {
      if(save.disabled) return;
      let sending;
      if(upload){
        const file = field.files && field.files[0];
        if(!file){ msg.textContent = 'Choose a file.'; return; }
        if(file.size > UPLOAD_MAX){ msg.textContent = 'File too large (max 25 MB).'; return; }
        sending = () => api.appActionFile(appId, s.action, s.key, file, tileCfg(appId));
      }else{
        const typed = String(field.value);
        const value = numeric ? Number(typed) : typed;
        if(choice && !typed){ msg.textContent = 'Choose an option.'; return; }
        if(!choice && (!typed.trim() || (numeric && !Number.isFinite(value)))){
          msg.textContent = numeric ? 'Enter a number.' : 'Enter something to save.';
          return;
        }
        sending = () => api.appAction(appId, s.action, {[s.key]: value}, tileCfg(appId));
      }
      msg.textContent = '';
      save.disabled = field.disabled = true;
      const res = await sending();
      save.disabled = field.disabled = false;
      if(res.ok && res.spec) repaintTile(appId, res.spec);
      else msg.textContent = res.error || "Couldn't save.";
    };
    save.onclick = submit;
    // Enter in a file picker opens it: it's Save that sends.
    if(!upload) field.onkeydown = e => { if(e.key==='Enter') submit(); };
    return box;
  }
  function specMsg(title, text){
    const box = el('div','spec-msg');
    if(title){ const b = el('b'); b.textContent = title; box.appendChild(b); }
    if(text){ const t = el(title ? 'code' : 'span'); t.textContent = text; box.appendChild(t); }
    return box;
  }

  /* A sparkline of the points present, evenly spaced, under its title
     if it has one. A gap - a null value, or a day missing between two
     dated points - breaks the line there: nothing is joined across it,
     and nothing is drawn as zero. The line is drawn in a 100x100 box
     stretched to the plot; the dots are HTML, so they stay round. */
  function sparkline(raw, title){
    // A point is a value, {date, value} or [date, value].
    const pts = raw.map(p => {
      const pair = Array.isArray(p), obj = !pair && p!==null && typeof p==='object';
      const v = pair ? p[1] : obj ? p.value : p;
      const day = pair ? p[0] : obj ? p.date : null;
      const d = typeof day==='string' && /^\d{4}-\d{2}-\d{2}$/.test(day) ? day : null;
      return {v: typeof v==='number' && Number.isFinite(v) ? v : null, d};
    });
    const line = el('div','spec-line');
    if(title!=null && title!==''){ const t = el('div','t'); t.textContent = title; line.appendChild(t); }
    const box = el('div','plot');
    line.appendChild(box);
    const vals = pts.filter(p => p.v!==null).map(p => p.v);
    if(!vals.length){ box.appendChild(specMsg(null, 'No data')); return line; }

    const n = pts.length, lo = Math.min(...vals), hi = Math.max(...vals);
    const X = i => n===1 ? 50 : i/(n-1)*100;
    const Y = v => hi===lo ? 50 : 6 + (1-(v-lo)/(hi-lo))*88;
    // Runs of indexes with nothing missing between them.
    const runs = []; let run = [];
    pts.forEach((p, i) => {
      const prev = pts[i-1];
      const gap = p.v===null || (prev && prev.d && p.d && dayNum(p.d) - dayNum(prev.d) > 1);
      if(gap && run.length){ runs.push(run); run = []; }
      if(p.v!==null) run.push(i);
    });
    if(run.length) runs.push(run);

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    runs.filter(r => r.length > 1).forEach(r => {
      const pl = document.createElementNS(NS, 'polyline');
      pl.setAttribute('points', r.map(i => X(i).toFixed(2)+','+Y(pts[i].v).toFixed(2)).join(' '));
      svg.appendChild(pl);
    });
    box.appendChild(svg);
    const last = runs[runs.length-1].slice(-1)[0];
    const dot = (i, cls) => {
      const d = el('span', cls);
      d.style.left = X(i)+'%'; d.style.top = Y(pts[i].v)+'%';
      box.appendChild(d);
    };
    // A point with a gap either side has no line to sit on: a dot shows it.
    runs.filter(r => r.length===1 && r[0]!==last).forEach(r => dot(r[0], 'dot'));
    dot(last, 'dot end');
    box.setAttribute('role', 'img');
    box.setAttribute('aria-label', (title ? title+': ' : '')
      + `trend of ${vals.length} value${vals.length===1 ? '' : 's'}, `
      + `between ${fmtSpecValue(lo)} and ${fmtSpecValue(hi)}`);
    return line;
  }

  /* A timeline: one lane or two of time-blocks on one vertical time
     axis, from the earliest start to the latest end (or now, if later)
     - lane 0 on the left, in the lighter tone, lane 1 on the right, in
     the darker - under the lanes' headings. The axis is laid out to the
     viewport it scrolls in (.tl-scroll): a week (TL_VIEW_MS) fills its
     height, so a longer span scrolls, and a gap - days of rest - is real
     empty axis. A block runs from its start to its end, never shorter
     than TL_MIN_BLOCK_PX, so a short one stays legible; the now line
     crosses both lanes, and a grey_after_now lane is greyed from it
     down. A lane's bands (a trip away) are shaded behind its blocks on
     the same scale - their true length, no floor - each band's label
     past the block(s) over its top edge (the flight out, which starts
     with it), so it's on the layover, not under a block. A viewport
     shorter than TL_MIN_WEEK_PX (a 2x1 tile's) shows less than a week,
     at that scale, and scrolls further: squeezed to a week, its blocks
     would all be at the floor, running into each other over the gaps
     between them. Everything an app sent is set as text.

     The viewport's height is only known once the timeline is on the
     page, which it isn't while renderSpec() builds it: it's laid out at
     TL_FALLBACK_PX first, so it's whole from the start, then on the
     next frame and on every resize (a ResizeObserver, let go of with its
     tile - releaseTimelines()) at the height it has. The first real
     layout scrolls the now line to the middle (with no now, the end into
     view); after that a resize keeps the time at the top where it is,
     and with no height at all - Home hidden behind another tab - the
     last layout stands.

     A synced timeline (s.sync, a focus group's name) is drawn around its
     group's focus clock (below) instead: a fixed cursor across the
     middle of the viewport (.tl-cursor, over it in .tl-view - the track
     scrolls under it), the time under it over the headings (.tl-readout,
     UTC, to the quarter hour) and a Now button (.tl-nowbtn) while the
     group isn't following now. It's scrolled to put the group's focus
     time under the cursor - on every layout, and whenever the group's
     focus moves - not to centre now: the two are one only while it
     follows. The track is padded half a viewport at each end, so every
     time on the axis can reach the cursor. Scrolled by hand, it moves
     the group's focus to the time under its cursor and stops it
     following. The now line stays at s.now, tagged Now on the greyed
     lane. With no s.sync, none of that is drawn. */
  const TL_VIEW_MS = 7 * 86400000;   // the span of axis one viewport's height shows: a week
  const TL_MIN_WEEK_PX = 240;        // ... but never less than this to the week: a shorter viewport shows less
  const TL_MIN_BLOCK_PX = 18;        // a block's least height: a short duty stays legible, and tappable
  const TL_FALLBACK_PX = 240;        // the viewport's height until it has one: built detached, or no layout
  const timelines = new Set();       // the timelines drawn, each {scroll, observer, group, show}: see releaseTimelines()
  /* The focus clock: by group name, the time in focus on the synced
     timelines - the one under every member's cursor - and whether it's
     following now. UI state, in memory for the page's life: never
     stored, so a page load starts every group on now. The first
     timeline naming a group starts it, following now; a timeline joins
     (members) when drawn and leaves once it's off the page
     (releaseTimelines()), so a tile drawn afresh keeps its group's time.
     setFocus() publishes a change to every member: each scrolls the
     time under its cursor - by its own scale: the time is what's shared,
     never a scroll position - bar the one scrolled by hand (already
     there), and redraws its readout and Now button. While a group
     follows, the follow tick (followNow(), on each quarter hour) moves
     it on to now; a scroll by hand stops that, and Now starts it again.
     Every focus time is snapped to the quarter hour (tlSnap). */
  const TL_STEP_MS = 15 * 60000;     // the focus clock's grain: its times, readout and follow tick to the quarter hour
  const tlSnap = ms => Math.floor(ms / TL_STEP_MS) * TL_STEP_MS;
  const focusGroups = new Map();     // a focus group's name -> {focusMs, following, members}
  let followTimer = null;            // the one follow tick, set going by the first group
  function focusGroup(name){
    let g = focusGroups.get(name);
    if(!g){
      g = {focusMs: tlSnap(Date.now()), following: true, members: new Set()};
      focusGroups.set(name, g);
      armFollow();
    }
    return g;
  }
  function setFocus(g, focusMs, following, from){
    g.focusMs = focusMs;
    g.following = following;
    g.members.forEach(m => m.show(m!==from));
  }
  function followNow(){
    const now = tlSnap(Date.now());
    focusGroups.forEach(g => { if(g.following && g.focusMs!==now) setFocus(g, now, true); });
  }
  function armFollow(){
    if(followTimer!==null) return;
    // Due on the next quarter hour, then again on each one after.
    followTimer = setTimeout(() => { followTimer = null; followNow(); armFollow(); }, TL_STEP_MS - Date.now() % TL_STEP_MS);
  }
  const TL_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const TL_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  /* A focus time as the readout says it, in UTC: Mon 03 Nov 14:15Z. */
  function fmtFocus(ms){
    const d = new Date(ms), two = n => String(n).padStart(2, '0');
    return `${TL_DAYS[d.getUTCDay()]} ${two(d.getUTCDate())} ${TL_MONTHS[d.getUTCMonth()]} `
      + `${two(d.getUTCHours())}:${two(d.getUTCMinutes())}Z`;
  }
  function timelineSpec(s){
    const ms = t => { const v = typeof t==='string' ? Date.parse(t) : NaN; return Number.isFinite(v) ? v : null; };
    const text = v => v!=null && v!=='' ? String(v) : '';
    // A hand-built spec is drawn as far as it can be: two lanes at most,
    // and an interval or a band without both ends, in order, left out.
    const spans = list => (Array.isArray(list) ? list : []).map(i => {
      const iv = i!==null && typeof i==='object' ? i : {};
      return {a: ms(iv.start), b: ms(iv.end), label: text(iv.label)};
    }).filter(b => b.a!==null && b.b!==null && b.b >= b.a);
    const lanes = (Array.isArray(s.lanes) ? s.lanes : []).slice(0, 2).map(raw => {
      const l = raw!==null && typeof raw==='object' ? raw : {};
      return {label: text(l.label), grey: l.grey_after_now===true, blocks: spans(l.intervals), bands: spans(l.bands)};
    });
    const now = ms(s.now);
    const box = el('div','spec-timeline');
    if(s.title!=null && s.title!==''){ const t = el('div','t'); t.textContent = s.title; box.appendChild(t); }
    // The axis spans every block and band: none drawn off it.
    const all = lanes.flatMap(l => [...l.blocks, ...l.bands]);
    if(!all.length){ box.appendChild(specMsg(null, 'No data')); return box; }
    const t0 = all.reduce((m, b) => Math.min(m, b.a), Infinity);
    const t1 = all.reduce((m, b) => Math.max(m, b.b), now===null ? -Infinity : now);
    // Synced: a member of its focus group, its readout and Now button
    // over the headings.
    const group = typeof s.sync==='string' && s.sync!=='' ? focusGroup(s.sync) : null;
    let readout = null, nowBtn = null;
    if(group){
      const row = el('div','tl-focus');
      readout = row.appendChild(el('div','tl-readout'));
      readout.title = 'The time at the cursor, UTC';
      nowBtn = row.appendChild(el('button','btn sm tl-nowbtn'));
      nowBtn.type = 'button';
      nowBtn.textContent = 'Now';
      nowBtn.title = 'Back to now, and follow it';
      nowBtn.onclick = () => setFocus(group, tlSnap(Date.now()), true);
      box.appendChild(row);
    }

    if(lanes.some(l => l.label)){
      const head = el('div','tl-head');
      lanes.forEach(l => { const h = el('div','tl-lh'); h.textContent = l.label; head.appendChild(h); });
      box.appendChild(head);
    }
    const scroll = el('div','tl-scroll');
    scroll.tabIndex = 0;   // scrolled from the keyboard too
    scroll.setAttribute('role','region');
    scroll.setAttribute('aria-label', (s.title ? s.title+': ' : '') + 'timeline, '
      + lanes.map((l, i) => `${l.label || 'lane '+(i+1)} ${l.blocks.length}`).join(', '));
    const track = el('div','tl-track');
    const cols = lanes.map((l, i) => {
      const col = el('div','tl-lane l'+i);
      col.style.left = (i * 100 / lanes.length)+'%';
      col.style.width = (100 / lanes.length)+'%';
      // First, so under the rest: the bands, each a trip's whole time
      // away, its flights drawn over it.
      const bands = l.bands.map(b => {
        const band = col.appendChild(el('div','tl-band'));
        const tag = b.label ? band.appendChild(el('div','tl-band-label')) : null;
        if(tag) tag.textContent = b.label;
        return {band, tag};
      });
      // Under the blocks: one held to the floor can run on past now, and
      // stays readable over the grey.
      const future = l.grey && now!==null ? col.appendChild(el('div','tl-future')) : null;
      const blocks = l.blocks.map(b => {
        const n = el('div','tl-block');
        n.textContent = b.label;
        return col.appendChild(n);
      });
      track.appendChild(col);
      return {l, bands, blocks, future};
    });
    const line = now!==null ? track.appendChild(el('div','tl-now')) : null;
    if(group && line){
      // Tagged under the line, on the greyed lane (the first, with none).
      const tag = line.appendChild(el('div','tl-now-tag'));
      tag.textContent = 'Now';
      tag.style.left = `calc(${Math.max(0, lanes.findIndex(l => l.grey)) * 100 / lanes.length}% + 4px)`;
    }
    scroll.appendChild(track);
    if(group){
      // The cursor over the viewport, not in it: the track scrolls, it stays.
      const view = el('div','tl-view');
      view.appendChild(scroll);
      view.appendChild(el('div','tl-cursor'));
      box.appendChild(view);
    }else box.appendChild(scroll);

    let laidH = 0, laidPx = 0;   // the viewport height it's laid out for, and its scale (px a ms): 0 before any
    let topMs = null;   // the time at the viewport's top, as last scrolled: null before a real layout
    let ours = null;    // synced: the scrollTop it last set itself, so its own scroll isn't taken for the user's
    const layout = () => {
      const h = scroll.clientHeight || 0;
      if(!h && laidH) return;   // hidden, or gone: the last layout stands
      const viewH = h || TL_FALLBACK_PX, px = Math.max(viewH, TL_MIN_WEEK_PX) / TL_VIEW_MS;
      // Synced, half a viewport of axis past each end, so the cursor - its
      // middle - can reach every time on it.
      const pad = group ? viewH/2 : 0;
      if(viewH!==laidH){
        let bottom = pad + (t1 - t0) * px;
        cols.forEach(c => {
          const placed = c.l.blocks.map((b, i) => {
            const top = pad + (b.a - t0) * px, height = Math.max(TL_MIN_BLOCK_PX, (b.b - b.a) * px);
            c.blocks[i].style.top = top+'px';
            c.blocks[i].style.height = height+'px';
            bottom = Math.max(bottom, top + height);
            return [top, top + height];
          });
          c.l.bands.forEach((d, i) => {
            const top = pad + (d.a - t0) * px, {band, tag} = c.bands[i];
            band.style.top = top+'px';
            band.style.height = (d.b - d.a) * px+'px';
            // Its label below whatever covers its top edge - the flight
            // out - so on the layover; clipped by the band if it's short.
            if(tag) tag.style.top = placed.reduce((y, [a, z]) => a <= top && top < z ? Math.max(y, z) : y, top) - top+'px';
          });
        });
        track.style.height = (bottom + pad)+'px';
        if(now!==null){
          const y = pad + (now - t0) * px;
          line.style.top = y+'px';
          cols.forEach(c => { if(c.future) c.future.style.top = Math.max(0, y)+'px'; });
        }
        laidH = viewH;
        laidPx = px;
      }
      if(!h) return;            // no real height yet: nothing to scroll
      if(group){ toFocus(); return; }
      if(topMs===null) topMs = now!==null ? now - viewH/2/px : t1 - viewH/px;
      scroll.scrollTop = (topMs - t0) * px;
    };
    // Synced: the group's focus time under the cursor - padded, that's
    // where its scrollTop is that time's offset on the axis. A time
    // past either end of the axis scrolls as far as it goes.
    const toFocus = () => {
      if(!scroll.clientHeight || !laidPx) return;
      scroll.scrollTop = (group.focusMs - t0) * laidPx;
      ours = scroll.scrollTop;
    };
    const t = {scroll, observer: null, group, show: null};
    if(group){
      // Its own scroll to the focus passes; the user's moves the group's
      // focus to the time under the cursor, and stops it following.
      scroll.onscroll = () => {
        if(!scroll.clientHeight || !laidPx) return;
        const mine = ours!==null && Math.abs(scroll.scrollTop - ours) < 1;
        ours = null;
        if(!mine) setFocus(group, tlSnap(t0 + scroll.scrollTop / laidPx), false, t);
      };
      t.show = rescroll => {
        readout.textContent = fmtFocus(group.focusMs);
        nowBtn.hidden = group.following;
        if(rescroll) toFocus();
      };
      group.members.add(t);
      t.show(false);
    }else{
      scroll.onscroll = () => { if(scroll.clientHeight && laidPx) topMs = t0 + scroll.scrollTop / laidPx; };
    }
    layout();
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(layout);
    if(typeof ResizeObserver==='function'){
      t.observer = new ResizeObserver(() => { if(scroll.isConnected) layout(); else releaseTimelines(); });
      t.observer.observe(scroll);
    }
    if(t.observer || group) timelines.add(t);
    return box;
  }
  /* Lets go of the timelines no longer on the page - their tile drawn
     afresh, or Home painted anew - disconnecting each one's
     ResizeObserver and taking a synced one out of its focus group, so
     none keeps a replaced tile alive (the group, and its time, stay).
     Called wherever Home's faces are replaced (paintHome, repaintTile). */
  function releaseTimelines(){
    timelines.forEach(t => {
      if(t.scroll.isConnected) return;
      if(t.observer) t.observer.disconnect();
      if(t.group) t.group.members.delete(t);
      timelines.delete(t);
    });
  }

  /* =========================================================
     shared bits
     ========================================================= */
  /* ---- theme (per browser) ---- */
  function setTheme(t){
    if(t==='auto'){
      document.documentElement.removeAttribute('data-theme');
      try{ localStorage.removeItem('of-theme'); }catch(e){}
    }else{
      document.documentElement.setAttribute('data-theme', t);
      try{ localStorage.setItem('of-theme', t); }catch(e){}
    }
    reflectTheme();
  }
  function curTheme(){ try{ return localStorage.getItem('of-theme') || 'auto'; }catch(e){ return 'auto'; } }
  function reflectTheme(){
    const st = $('#themeState'); if(st) st.textContent = curTheme();
  }
  $('#themeToggle').onclick = ()=>{
    const order = ['auto','light','dark'];
    setTheme(order[(order.indexOf(curTheme())+1) % order.length]);
  };
  (function initTheme(){
    const t = curTheme();
    if(t!=='auto') document.documentElement.setAttribute('data-theme', t);
    reflectTheme();
  })();

  /* ---- top bar: today's date ---- */
  function paintDate(){
    $('#today').textContent = new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  }

  /* ---- tabs: Home's (the layout's tabs: the app tiles) and Data (the console) ----
     Data has a panel of its own. A layout tab has none: they all share
     the Home panel, and pick which of the layout's tabs it draws
     (switchTab). Switching only shows one panel and hides the other;
     the console keeps its state underneath. */
  const PANEL_TABS = ['data'];   // the strip's tabs with a panel of their own - never a layout tab
  let panelShown = null;          // the panel on screen: 'home', or one of PANEL_TABS
  function closeFloating(){ closePop(); hideTip(); }
  function showTab(name){
    if(PANEL_TABS.includes(name)) showPanel(name);
    else switchTab(name);
  }
  function showPanel(panel){
    panelShown = panel;
    document.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.dataset.panel!==panel; });
    markTabs();
    closeFloating();
  }
  /* The strip's active tab: the panel's - or, on Home, the layout tab it
     draws. */
  function markTabs(){
    const on = panelShown==='home' ? home.activeTab : panelShown;
    tabButtons().forEach(b => {
      const active = b.dataset.tab===on;
      b.classList.toggle('active', active);
      if(active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
  }
  // The strip's own buttons (the stand-in Home, and Data); the layout's
  // tabs get theirs as they're drawn (paintTabStrip).
  document.querySelectorAll('.tab[data-tab]').forEach(b => { b.onclick = () => showTab(b.dataset.tab); });
  // Shown only while Configure is on.
  $('#addTabBtn').onclick = () => { if(home.configuring && !home.saving) openTabEditor(null); };

  /* ---- settings (per browser, like the theme) ----
     One control for now: the tab the page opens on. Its options are the
     tab strip's own tabs - Home's, as the layout names them, and Data -
     so a new tab is offered without touching this. */
  const OPENING_TAB = 'of-opening-tab';
  const tabButtons = () => Array.from(document.querySelectorAll('.tab[data-tab]'));
  function openingTab(){
    let t = null;
    try{ t = localStorage.getItem(OPENING_TAB); }catch(e){}
    // None chosen: Data.
    if(!t) return 'data';
    // Until the layout is read, its tabs aren't on the strip: the choice
    // stands, and Home draws it once it's read - or, if it's no tab, the
    // default (renderActiveTab).
    if(!home.layout || tabButtons().some(b => b.dataset.tab===t)) return t;
    // A tab since deleted: Home's default tab.
    return home.layout.default_tab;
  }
  function openSettings(){
    const current = openingTab();
    const options = tabButtons().map(b =>
      `<option value="${esc(b.dataset.tab)}"${b.dataset.tab===current ? ' selected' : ''}>${esc(b.textContent.trim())}</option>`).join('');
    const {box, close} = openModal(`
      <h4>Settings</h4>
      <div class="field">
        <label for="openingTab">Opening page</label>
        <select class="input" id="openingTab">${options}</select>
      </div>
      <div class="modal-actions">
        <button class="btn sm" data-act="close" type="button">Close</button>
        <button class="btn sm primary" data-act="save" type="button">Save</button>
      </div>`);
    const select = box.querySelector('#openingTab');
    box.querySelector('[data-act="close"]').onclick = close;
    box.querySelector('[data-act="save"]').onclick = () => {
      try{ localStorage.setItem(OPENING_TAB, select.value); }catch(e){}
      close();
    };
    select.focus();
  }
  $('#settingsBtn').onclick = openSettings;

  /* =========================================================
     BOOT - paint the shell straight away, then fill it in
     ========================================================= */
  window.addEventListener('resize', closeFloating);
  window.addEventListener('scroll', closeFloating, {passive:true, capture:true});
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeFloating(); });

  showTab(openingTab());
  paintDate();
  paintSources();
  paintData();
  paintAppControls();
  paintApps();
  paintHomeHead();
  paintHome();
  // In parallel: each part paints as soon as its own reads land.
  refreshConnectors();
  loadAppSources();
  loadData();
  loadApps();
  loadHome();
})();
</script>

</body>

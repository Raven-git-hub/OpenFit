  const tip = el('div','tip');
  tip.hidden = true;
  document.body.appendChild(tip);
  let tipFor = null;
  function showTip(target){
    tipFor = target;
    tip.textContent = target.getAttribute('data-tip');
    tip.hidden = false;
    const r = target.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let top = r.top - h - 8;
    if(top < 6) top = r.bottom + 8;
    tip.style.top = top + 'px';
    tip.style.left = Math.max(6, Math.min(r.left + r.width/2 - w/2, window.innerWidth - w - 6)) + 'px';
  }
  function hideTip(){ tip.hidden = true; tipFor = null; }
  function tipTarget(e){
    const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    if(t===tipFor) return;
    if(t && t.getAttribute('data-tip')) showTip(t); else hideTip();
  }
  // mousemove rather than mouseover, so a tip hidden by a scroll comes
  // back as soon as the pointer moves again.
  document.addEventListener('mousemove', tipTarget);
  document.addEventListener('mouseout', e => { if(!e.relatedTarget) hideTip(); });
  document.addEventListener('focusin', tipTarget);
  document.addEventListener('focusout', hideTip);

  /* =========================================================
     VOICE - a spoken explanation, a button beside a card's title
     One shared <audio>, so only one clip plays at a time. The clips
     come from GET /audio/<name> (app/audio/, baked into the image). A
     missing one 404s and the button just resets: it stays, and works
     the moment the file is there.
     ========================================================= */
  const VOICE_CLIPS = {
    sources:'/audio/connected-sources.mp3',
    data:'/audio/your-data.mp3',
    // TODO(feat/bundle-voice-clips): not recorded yet - until
    // applications.mp3 lands in app/audio/ it 404s and the button resets.
    apps:'/audio/applications.mp3',
  };
  const VOICE_ICON = {
    play:'<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.8 8.4 5 3 8.2z"/></svg>',
    stop:'<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/></svg>',
  };
  const voice = $('#voice');
  let voiceOn = null;   // the key of the clip playing, or null
  let voiceRun = 0;     // bumped on every stop, so a stale play() failure can't reset a newer clip

  function paintVoice(b){
    const on = b.dataset.voice===voiceOn;
    b.classList.toggle('playing', on);
    b.innerHTML = on ? VOICE_ICON.stop : VOICE_ICON.play;
    b.setAttribute('aria-label', (on ? 'Stop' : 'Play') + ' the explanation: ' + b.dataset.title);
  }
  const paintVoices = () => document.querySelectorAll('.voice-btn').forEach(paintVoice);

  function stopVoice(){
    voiceRun++;
    voice.pause();
    try{ voice.currentTime = 0; }catch(e){}
    voiceOn = null;
    paintVoices();
  }
  /* A click plays the clip from the start; clicking it again stops it,
     and clicking the other one stops it and plays that one instead. */
  function toggleVoice(key){
    const was = voiceOn;
    stopVoice();
    if(was===key) return;
    const run = voiceRun;
    voiceOn = key;
    voice.src = VOICE_CLIPS[key];
    try{ voice.currentTime = 0; }catch(e){}
    paintVoices();
    const p = voice.play();
    // No file yet (404), or the browser refused: back to idle, silently.
    if(p && p.catch) p.catch(() => { if(run===voiceRun) stopVoice(); });
  }
  voice.addEventListener('ended', stopVoice);
  voice.addEventListener('error', stopVoice);

  /* A card's <h3>, with its voice button after it. The cards repaint,
     so a fresh button picks up whatever is playing. */
  function cardTitle(text, key){
    const t = el('div','card-title', `<h3>${esc(text)}</h3>`);
    const b = el('button','voice-btn');
    b.type = 'button';
    b.dataset.voice = key;
    b.dataset.title = text;
    b.onclick = () => toggleVoice(key);
    paintVoice(b);
    t.appendChild(b);
    return t;
  }

  /* =========================================================
     CONNECTED SOURCES
     ========================================================= */
  /* Connected devices, from /api/connectors. A device is "connected"
     when an account has been stored for it; its secrets never come back
     over the API, only the fact that they exist (and, in its Settings,
     its non-password login). */
  function paintSources(){
    const card = $('#sourcesCard');
    card.innerHTML = '';
    card.appendChild(cardTitle('Connected sources', 'sources'));

    if(state.connectors===null){
      card.appendChild(el('p','hint','Loading…'));
      return;
    }
    const connected = state.connectors.filter(c => c.connected);
    if(!connected.length){
      card.appendChild(el('p','hint',
        'No devices connected yet. Add one below - OpenFit pulls from it on a schedule, or when you press Sync now.'));
    }
    connected.forEach(c => card.appendChild(sourceRow(c)));
    orphans().forEach(o => card.appendChild(orphanRow(o)));
    card.appendChild(addSourceRow());
  }

  const GEAR = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M13.26 6.39 15.17 6.61 15.17 9.39 13.26 9.61 12.86 10.58 14.05 12.08 12.08 14.05 10.58 12.86 9.61 13.26 9.39 15.17 6.61 15.17 6.39 13.26 5.42 12.86 3.92 14.05 1.95 12.08 3.14 10.58 2.74 9.61 .83 9.39 .83 6.61 2.74 6.39 3.14 5.42 1.95 3.92 3.92 1.95 5.42 3.14 6.39 2.74 6.61 .83 9.39 .83 9.61 2.74 10.58 3.14 12.08 1.95 14.05 3.92 12.86 5.42ZM10.4 8a2.4 2.4 0 1 0-4.8 0 2.4 2.4 0 1 0 4.8 0Z"/></svg>';

  function sourceRow(c){
    const row = el('div','src', `
      <div class="src-name">${esc(c.name)}</div>
      <div class="src-r">
        <span class="pill ok">● connected</span>
        <button class="btn sm" type="button" data-act="sync">Sync now</button>
        <button class="btn sm" type="button" data-act="settings" aria-haspopup="dialog">${GEAR}Settings</button>
      </div>`);

    const syncBtn = row.querySelector('[data-act="sync"]');
    syncBtn.onclick = async ()=>{
      syncBtn.disabled = true; syncBtn.title = ''; syncBtn.textContent = 'Syncing…';
      const res = await api.syncPlugin(c.id);
      if(res.ok){
        syncBtn.textContent = 'Synced ✓';
        loadData();   // the sync re-derived its window: refresh the rows
        loadHome();   // ... and the tiles drawn from it
      }else{
        syncBtn.textContent = res.error==='a sync is already in progress' ? 'Already syncing' : 'Failed';
        syncBtn.title = res.error || 'Sync failed';
      }
      setTimeout(()=>{ syncBtn.textContent = 'Sync now'; syncBtn.disabled = false; }, 2200);
    };

    row.querySelector('[data-act="settings"]').onclick = () => openSourceSettings(c);
    row.dataset.id = c.id;   // so a flow that repaints the card can find it again
    return row;
  }

  /* ---- a source's Settings popup ----
     Its account (/api/connectors/<id>/detail) as an info list, ending in
     how often it syncs, and Remove source behind a two-step gate in the
     same modal: keep or wipe the data, then are-you-sure. No confirm():
     the steps are the gate. */
  const VIA_NAMES = {credentials:'Password', oauth:'OAuth'};
  /* Sync every: the presets, in hours. Default (null) is the baseline -
     no override stored - not a number of its own. */
  const CADENCES = [[1,'1h'], [3,'3h'], [null,'Default'], [12,'12h'], [24,'24h']];
  /* A stored stamp as a Date. synced_at is SQLite's "YYYY-MM-DD HH:MM:SS",
     UTC with no zone; created_at is ISO with its offset. */
  const parseStamp = s => new Date(/(Z|[+-]\d\d:?\d\d)$/i.test(s) ? s : String(s).replace(' ','T')+'Z');
  const fmtWhen = (s, opts) => {
    const d = parseStamp(s);
    return isNaN(d.getTime()) ? String(s) : d.toLocaleString('en-GB', opts);
  };
  const fmtSync  = s => s ? fmtWhen(s, {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Never';
  const fmtAdded = s => s ? fmtWhen(s, {day:'numeric',month:'short',year:'numeric'}) : '—';

  function openSourceSettings(c){
    const name = esc(c.name);
    /* An oauth source's authorization can lapse - Google's every ~7 days
       for a Testing-mode client - so it can be renewed in place, beside
       how it's connected: the same consent round trip as adding it, with
       the stored client details. Not a danger action: nothing goes. */
    const reauth = c.add_flow === 'oauth'
      ? '<button class="btn sm" data-act="reauth" type="button" aria-haspopup="dialog">Re-authenticate</button>'
      : '';
    const {box, close} = openModal(`
      <h4>${name}</h4>
      <div data-step="info">
        <dl class="info">
          <dt>Login</dt><dd data-f="login">…</dd>
          <dt>Connected via</dt><dd><span data-f="via">…</span>${reauth}</dd>
          <dt>Last sync</dt><dd data-f="sync" class="tnum">…</dd>
          <dt>Added</dt><dd data-f="added" class="tnum">…</dd>
          <dt>Sync every</dt>
          <dd><div class="seg" data-f="cadence" role="group" aria-label="Sync every" aria-busy="true">${
            CADENCES.map(([h, label]) =>
              `<button class="btn sm" type="button" data-hours="${h==null ? '' : h}" aria-pressed="false">${label}</button>`
            ).join('')}</div></dd>
        </dl>
        <div class="modal-actions split">
          <button class="btn sm danger" data-act="remove" type="button">Remove source</button>
          <button class="btn sm" data-act="close" type="button">Close</button>
        </div>
      </div>
      <div data-step="keep" hidden>
        <p class="hint">Disconnecting stops future syncs.</p>
        <div class="danger-panel">
          <h5>Wipe data?</h5>
          <p>Keep the source's historical data for analysis, or wipe it entirely from the database?</p>
          <div class="modal-actions">
            <button class="btn sm" data-act="keep" type="button">Keep data</button>
            <button class="btn sm danger" data-act="wipe" type="button">Wipe data</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn sm" data-act="back" type="button">Cancel</button>
        </div>
      </div>
      <div data-step="confirm" hidden>
        <div class="danger-panel">
          <h5>Are you sure?</h5>
          <p data-f="confirm"></p>
          <div class="modal-actions">
            <button class="btn sm" data-act="back" type="button">Cancel</button>
            <button class="btn sm danger solid" data-act="confirm" type="button">Remove</button>
          </div>
        </div>
      </div>
      <div class="form-msg bad src-msg" data-f="msg"></div>`);

    const f = key => box.querySelector(`[data-f="${key}"]`);
    const msg = f('msg');
    const confirmBtn = box.querySelector('[data-act="confirm"]');
    let wipe = false;

    /* Sync every: the active preset is highlighted; picking another PUTs
       it and moves the highlight. On failure the error shows and the
       highlight stays where it was. */
    const seg = f('cadence');
    const segBtns = [...seg.querySelectorAll('button')];
    const hoursOf = b => b.dataset.hours === '' ? null : Number(b.dataset.hours);
    let cadence;   // the active preset (null = Default); undefined until /detail lands
    function showCadence(hours){
      cadence = hours;
      segBtns.forEach(b => {
        const on = hoursOf(b) === hours;
        b.classList.toggle('primary', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }
    segBtns.forEach(b => {
      b.onclick = async ()=>{
        const hours = hoursOf(b);
        // Already active: a PUT would only restart its job's timer.
        if(hours === cadence) return;
        seg.setAttribute('aria-busy','true');
        msg.textContent = '';
        const res = await api.setConnectorCadence(c.id, hours);
        seg.removeAttribute('aria-busy');
        if(res.ok) showCadence(hours);
        else msg.textContent = res.error || "Couldn't change how often this source syncs";
      };
    });

    function step(name){
      box.querySelectorAll('[data-step]').forEach(s => { s.hidden = s.dataset.step!==name; });
      msg.textContent = '';
      // Focus the step's safe way out: Close on the info list, then the
      // first button (Keep data, Cancel) on each step of the gate.
      const safe = name==='info' ? '[data-act="close"]' : `[data-step="${name}"] button`;
      box.querySelector(safe).focus();
    }
    function choose(w){
      wipe = w;
      f('confirm').innerHTML = w
        ? `<b>${name}</b> will be disconnected and all of its data wiped from the database. This can't be undone.`
        : `<b>${name}</b> will be disconnected. Its historical data stays in the database.`;
      confirmBtn.textContent = w ? 'Remove & wipe' : 'Remove';
      step('confirm');
    }

    box.querySelector('[data-act="close"]').onclick = close;
    // One modal at a time: Settings gives way to the consent flow.
    if(reauth) box.querySelector('[data-act="reauth"]').onclick = () => { close(); openOAuthDevice(c, true); };
    box.querySelector('[data-act="remove"]').onclick = () => step('keep');
    box.querySelectorAll('[data-act="back"]').forEach(b => { b.onclick = () => step('info'); });
    box.querySelector('[data-act="keep"]').onclick = () => choose(false);
    box.querySelector('[data-act="wipe"]').onclick = () => choose(true);
    confirmBtn.onclick = async ()=>{
      const label = confirmBtn.textContent;
      confirmBtn.disabled = true; confirmBtn.textContent = 'Removing…';
      const res = await api.removeConnector(c.id, wipe);
      if(res.ok){
        close();
        // Both: the source has gone from the card, and a wipe re-derived
        // the days it covered - the data card must show what's left.
        refreshConnectors();
        loadData();
        loadHome();
      }else{
        msg.textContent = res.error || 'Could not remove this source';
        confirmBtn.disabled = false; confirmBtn.textContent = label;
      }
    };
    step('info');

    api.connectorDetail(c.id).then(d => {
      f('login').textContent = d.login || '—';
      f('via').textContent = VIA_NAMES[d.connected_via] || cap(d.connected_via) || '—';
      f('sync').textContent = fmtSync(d.last_sync);
      f('added').textContent = fmtAdded(d.added);
      showCadence(d.sync_is_default ? null : d.sync_hours);
      seg.removeAttribute('aria-busy');
    }).catch(() => {
      // Remove stays usable - it's the way out of an account that won't read.
      ['login','via','sync','added'].forEach(k => { f(k).textContent = '—'; });
      msg.textContent = "Couldn't load this source's details.";
      // So do the presets: with none highlighted, any pick is a change.
      seg.removeAttribute('aria-busy');
    });
  }

  /* ---- an uninstalled app's data ----
     Uninstall keeps what an app wrote (hand-entered data can't be
     re-synced), so it stays a source, app:<id>, with no app behind it.
     Removing it is its own step: in the source list it has no account
     to sync or set up - just Remove all data, and, opened, each metric
     it left behind with its own Remove data - each behind one confirm
     naming what goes. Your data's rows reach the same confirm, a
     metric at a time. */
  const orphans = () => (state.appSources || []).filter(o => o.orphaned);

  /* Read at boot, and again whenever what's orphaned may have changed:
     an app installed or uninstalled, an orphan's data removed. A failed
     read keeps what was shown - none, the first time: no controls. */
  async function loadAppSources(){
    try{
      const list = await api.appSources();
      state.appSources = Array.isArray(list) ? list : [];
    }catch(e){
      if(!state.appSources) state.appSources = [];
    }
    paintSources();
    // An open Your data row lists its sources: its orphan lines follow.
    if(state.data) state.data.rows.forEach(r => repaintPanel(r));
  }

  /* An orphan's row: its name, which opens the metrics it left behind
     (expandable(), as a Your data row opens), and Remove all data. */
  function orphanRow(o){
    const row = el('div','src orphan');
    const head = el('button','src-name orphan-head', `
      <span class="chev" aria-hidden="true">›</span>
      <span><span data-f="name"></span><span class="src-note" data-f="source"></span></span>`);
    head.querySelector('[data-f="name"]').textContent = o.id;
    head.querySelector('[data-f="source"]').textContent = o.source;
    const id = 'orphan-' + o.source.replace(/[^a-z0-9_-]/gi, '-');
    row.appendChild(expandable(el('div','orphan-item'), head, {
      open:state.orphanOpen, id:o.source, panelId:id, panel:() => orphanMetrics(o, id),
    }));
    const right = row.appendChild(el('div','src-r', `
      <span class="pill wait">○ app uninstalled</span>
      <button class="btn sm danger" type="button" data-act="remove-data" aria-haspopup="dialog">Remove all data</button>`));
    right.querySelector('[data-act="remove-data"]').onclick = () => openRemoveAppData(o, null);
    row.dataset.source = o.source;
    return row;
  }

  /* An orphan's metrics, opened: one line each - its name, and Remove
     data for just that metric. A custom one's app is gone, so it reads
     by its short key. */
  function orphanMetrics(o, id){
    const metrics = Array.isArray(o.metrics) ? o.metrics : [];
    if(!metrics.length){
      const none = el('p','dnote');
      none.id = id;
      none.textContent = `No readings left - ${appDataSummary(o)}, which Remove all data takes.`;
      return none;
    }
    const list = el('ul','orphan-metrics');
    list.id = id;
    metrics.forEach(key => {
      const line = el('li','orphan-metric', `
        <span data-f="metric"></span>
        <button class="btn sm danger" type="button" data-act="remove-metric" aria-haspopup="dialog">Remove data</button>`);
      line.querySelector('[data-f="metric"]').textContent = metricName(key);
      line.querySelector('[data-act="remove-metric"]').onclick = () => openRemoveAppData(o, key);
      line.dataset.metric = key;
      list.appendChild(line);
    });
    return list;
  }

  /* "3 readings across 1 metric (Weight)", then any sessions and samples. */
  const countOf = (n, what) => `${num(n)} ${what}${n===1 ? '' : 's'}`;
  function appDataSummary(o){
    const metrics = Array.isArray(o.metrics) ? o.metrics : [];
    const parts = [];
    if(o.readings) parts.push(`${countOf(o.readings, 'reading')} across ${countOf(metrics.length, 'metric')} (${metrics.map(metricName).join(', ')})`);
    if(o.sessions) parts.push(countOf(o.sessions, 'session'));
    if(o.samples) parts.push(countOf(o.samples, 'sample'));
    if(parts.length < 2) return parts[0] || 'Nothing is left';
    return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length-1];
  }

  /* Remove data: the confirm - the source settings' danger panel - then
     DELETE /api/app-sources/<id>, everything the app wrote; or, given a
     metric, DELETE /api/app-sources/<id>/<metric>, just that metric's
     readings. Everything is set as text. No confirm(): the panel is the
     gate, its Cancel the way out. */
  function openRemoveAppData(o, metric){
    const whole = metric==null;
    const {box, close} = openModal(`
      <h4 data-f="title"></h4>
      <p class="hint" data-f="hint"></p>
      <div class="danger-panel">
        <h5>Remove data?</h5>
        <p data-f="what"></p>
        <div class="modal-actions">
          <button class="btn sm" data-act="cancel" type="button">Cancel</button>
          <button class="btn sm danger solid" data-act="confirm" type="button">Remove data</button>
        </div>
      </div>
      <div class="form-msg bad src-msg" data-f="msg"></div>`);
    const f = key => box.querySelector(`[data-f="${key}"]`);
    f('title').textContent = whole ? o.source : metricName(metric);
    f('hint').textContent = whole
      ? 'Its app is no longer installed. What it wrote is still in your data.'
      : `From ${o.source}, whose app is no longer installed. The rest of what it wrote stays.`;
    f('what').textContent = whole
      ? `Remove all data from the uninstalled app '${o.id}'? ${appDataSummary(o)}. This can't be undone.`
      : `Remove ${metricName(metric)} from the uninstalled app '${o.id}'? This can't be undone.`;
    const msg = f('msg');
    const cancel = box.querySelector('[data-act="cancel"]');
    const confirmBtn = box.querySelector('[data-act="confirm"]');
    cancel.onclick = close;
    confirmBtn.onclick = async ()=>{
      confirmBtn.disabled = true; confirmBtn.textContent = 'Removing…';
      msg.textContent = '';
      const res = whole ? await api.removeAppSource(o.id) : await api.removeAppSourceMetric(o.id, metric);
      if(res.ok){
        close();
        // The source goes from the list (or the metric from its row);
        // the days it covered were re-derived, so the data card and the
        // tiles drawn from it too.
        loadAppSources();
        loadData();
        loadHome();
      }else{
        msg.textContent = res.error || "Couldn't remove this data";
        confirmBtn.disabled = false; confirmBtn.textContent = 'Remove data';
      }
    };
    cancel.focus();
  }

  /* The button at the foot of the card. Every connector the API offers
     that isn't connected yet is addable; add_flow decides which modal
     it opens. With nothing left to add it opens a placeholder until the
     add-source popup lands. */
  function addSourceRow(){
    const addable = state.connectors.filter(c => !c.connected);
    const wrap = el('div','src-add');
    const btn = el('button','btn sm','＋ Add source');
    btn.type = 'button';
    wrap.appendChild(btn);

    if(!addable.length){
      btn.setAttribute('aria-haspopup','dialog');
      btn.onclick = () => comingSoon('Add a source');
      return wrap;
    }
    btn.setAttribute('aria-haspopup','menu');
    btn.onclick = e => openAddMenu(e, addable);
    return wrap;
  }

  let popEl = null;
  function openAddMenu(e, addable){
    e.stopPropagation(); closePop();
    const p = el('div','pop');
    p.setAttribute('role','menu');
    p.appendChild(el('div','pop-h','Add a source'));
    addable.forEach(c => {
      const b = el('button','pop-item', esc(c.name));
      b.type = 'button';
      b.setAttribute('role','menuitem');
      b.onclick = () => { closePop(); openAddDevice(c); };
      p.appendChild(b);
    });
    document.body.appendChild(p);
    const r = e.currentTarget.getBoundingClientRect();
    p.style.top = (r.bottom + 6) + 'px';
    p.style.left = Math.max(10, Math.min(r.left, window.innerWidth - p.offsetWidth - 10)) + 'px';
    popEl = p;
    const first = p.querySelector('.pop-item'); if(first) first.focus();
    setTimeout(()=>document.addEventListener('click', closePop, {once:true}), 0);
  }
  function closePop(){ if(popEl){ popEl.remove(); popEl = null; } }

  /* Add-device modals, built from the connector's own manifest: whatever
     fields the plugin declares are the fields rendered, and add_flow picks
     the shape. Neither knows what device it is looking at. */
  function openAddDevice(c){
    if(c.add_flow === 'oauth') return openOAuthDevice(c);
    return openCredentialsDevice(c);
  }

  /* Modal chrome shared by both flows: backdrop, Escape, click-outside. */
  function openModal(html){
    const bg = el('div','modal-bg');
    const box = el('div','modal', html);
    bg.appendChild(box);
    document.body.appendChild(bg);

    function close(){
      document.removeEventListener('keydown', onKey);
      bg.remove();
    }
    function onKey(e){ if(e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    // Clicking the backdrop cancels too; clicking inside the card must not.
    bg.onclick = e => { if(e.target === bg) close(); };

    return {box, close};
  }

  /* A stand-in for popups that aren't built yet: Add source (when nothing
     is left to add), and Applications' Browse / Build / Create. */
  function comingSoon(title){
    const {box, close} = openModal(`
      <h4>${esc(title)}</h4>
      <p class="hint">Coming soon.</p>
      <div class="modal-actions">
        <button class="btn sm" data-act="close" type="button">Close</button>
      </div>`);
    const btn = box.querySelector('[data-act="close"]');
    btn.onclick = close;
    btn.focus();
  }

  /* The manifest rendered as inputs - the same markup for step one of
     either flow. */
  function manifestFields(c){
    const fields = Array.isArray(c.fields) ? c.fields : [];
    return fields.map((f,i)=>`
        <div class="field">
          <label for="cf${i}">${esc(f.label || f.key)}</label>
          <input class="input" id="cf${i}" data-key="${esc(f.key)}"
                 type="${f.type === 'password' ? 'password' : 'text'}"
                 autocomplete="${f.type === 'password' ? 'new-password' : 'off'}"
                 autocapitalize="off" spellcheck="false">
        </div>`).join('');
  }

  function fieldValues(box){
    const values = {};
    box.querySelectorAll('input[data-key]').forEach(input=>{
      values[input.dataset.key] = input.value;
    });
    return values;
  }

  function openCredentialsDevice(c){
    const {box, close} = openModal(`
      <h4>Add ${esc(c.name)}</h4>
      <p class="hint">Stored encrypted on this container and never sent anywhere except ${esc(c.name)}.</p>
      ${c.add_note ? `<p class="hint">${esc(c.add_note)}</p>` : ''}
      ${manifestFields(c)}
      <div class="form-msg bad" id="addMsg"></div>
      <div class="modal-actions">
        <button class="btn sm" data-act="cancel" type="button">Cancel</button>
        <button class="btn sm primary" data-act="add" type="button">Add</button>
      </div>`);

    const msg = box.querySelector('#addMsg');
    const addBtn = box.querySelector('[data-act="add"]');

    box.querySelector('[data-act="cancel"]').onclick = close;

    addBtn.onclick = async ()=>{
      const values = fieldValues(box);
      msg.textContent = '';
      addBtn.disabled = true; addBtn.textContent = 'Adding…';
      const res = await api.addConnector(c.id, values);
      if(res.ok){
        close();
        await refreshConnectors();
      }else{
        // The API validates against the manifest, so its message names
        // the field that is actually missing - show it as-is.
        msg.textContent = res.error || 'Could not add this device';
        addBtn.disabled = false; addBtn.textContent = 'Add';
      }
    };

    const first = box.querySelector('input');
    if(first) first.focus();
  }

  /* The oauth flow, in two steps in one modal.
     Step 1 collects the client details and asks the API for a consent URL;
     step 2 takes back whatever the provider left in the address bar. The
     redirect lands on a loopback port OpenFit doesn't serve, so that page
     always fails to load - the code is still there to copy, which is the
     whole trick and worth saying out loud on screen.
     `reauth` renews a connected source from its Settings popup: no fields
     and no setup note - the start call sends {} and the API fills in the
     stored client details (the secret never comes back to the browser) -
     and step 1 runs at once, straight to the approval link. Finishing
     replaces the stored refresh token and nothing else: the account keeps
     its Added date, its data, cadence and source roles. */
  function openOAuthDevice(c, reauth){
    const verb = reauth ? 'Re-authenticate' : 'Connect';
    const {box, close} = openModal(`
      <h4>${reauth ? 'Re-authenticate' : 'Add'} ${esc(c.name)}</h4>
      <div data-step="1">${reauth
        ? `<p class="hint">Approve access again to renew the connection. Its client details, data and settings stay as they are.</p>`
        : `<p class="hint">Stored encrypted on this container and never sent anywhere except ${esc(c.name)}.</p>
        ${c.add_note ? `<p class="hint">${esc(c.add_note)}</p>` : ''}
        ${manifestFields(c)}`}
      </div>
      <div data-step="2" hidden>
        <p class="hint">Approve access. The page will fail to load - that's expected.
           Paste the address it lands on (or just the code) below.</p>
        <div class="field">
          <a class="btn sm primary" id="authLink" target="_blank" rel="noopener noreferrer">Open the approval page</a>
        </div>
        <div class="field">
          <label for="oauthCode">Pasted address or code</label>
          <input class="input" id="oauthCode" type="text"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>
      <div class="form-msg bad" id="addMsg"></div>
      <div class="modal-actions">
        <button class="btn sm" data-act="cancel" type="button">Cancel</button>
        <button class="btn sm primary" data-act="link" type="button">Get authorization link</button>
        <button class="btn sm primary" data-act="connect" type="button" hidden>${verb}</button>
      </div>`);

    const msg      = box.querySelector('#addMsg');
    const stepOne  = box.querySelector('[data-step="1"]');
    const stepTwo  = box.querySelector('[data-step="2"]');
    const linkBtn  = box.querySelector('[data-act="link"]');
    const connBtn  = box.querySelector('[data-act="connect"]');
    const authLink = box.querySelector('#authLink');
    const codeIn   = box.querySelector('#oauthCode');

    // Cancel aborts at either step: nothing is stored until finish
    // succeeds, so there is no half-added device to clean up.
    box.querySelector('[data-act="cancel"]').onclick = close;

    linkBtn.onclick = async ()=>{
      msg.textContent = '';
      linkBtn.disabled = true; linkBtn.textContent = 'Working…';
      const res = await api.oauthStart(c.id, reauth ? {} : fieldValues(box));
      if(res.ok && res.auth_url){
        authLink.href = res.auth_url;
        stepOne.hidden = true;
        stepTwo.hidden = false;
        linkBtn.hidden = true;
        connBtn.hidden = false;
        codeIn.focus();
      }else{
        msg.textContent = res.error || 'Could not build an authorization link';
        linkBtn.disabled = false; linkBtn.textContent = 'Get authorization link';
      }
    };

    connBtn.onclick = async ()=>{
      msg.textContent = '';
      connBtn.disabled = true; connBtn.textContent = reauth ? 'Working…' : 'Connecting…';
      const res = await api.oauthFinish(c.id, codeIn.value);
      if(res.ok){
        close();
        await refreshConnectors();
        if(reauth) flashSource(c.id, '✓ re-authenticated');
      }else{
        // finish's own errors - a stale code, no refresh token - as-is.
        msg.textContent = res.error || (reauth ? 'Could not re-authenticate this source' : 'Could not connect this device');
        connBtn.disabled = false; connBtn.textContent = verb;
      }
    };

    if(reauth){ linkBtn.onclick(); return; }
    const first = box.querySelector('input');
    if(first) first.focus();
  }

  /* A brief word on a source's row, in its status pill - as Sync now
     says "Synced ✓" - then back to connected. */
  function flashSource(id, text){
    const row = Array.from(document.querySelectorAll('#sourcesCard .src')).find(r => r.dataset.id===id);
    if(!row) return;
    const pill = row.querySelector('.pill');
    pill.textContent = text;
    setTimeout(()=>{ pill.textContent = '● connected'; }, 2600);
  }

  async function refreshConnectors(){
    state.connectors = await api.listConnectors();
    paintSources();
  }

  /* =========================================================
     APPLICATIONS - the right-hand column of the Data tab
     Two blocks. On top, the controls card: the title, then Add
     Application, which opens the install popup (below), and Browse /
     Build / Create - placeholders, each opening the coming-soon
     modal. Below it, the list: one row per installed app, from
     /api/apps (the list Home draws its tiles from), with its own
     loading, empty and error states. A row expands as Your data's
     do: what the app reads, its files (each opens read-only), a slot
     for what it writes, then Refresh - its render, re-run - Update
     and Duplicate, which open the popup on its files, and Uninstall,
     the one write here, behind a confirm. Installing and updating
     are the popup's (below), which re-reads this.
     ========================================================= */
  const appsList = {
    status:'loading',   // loading | ready | error
    apps:null,          // /api/apps: [{id, name, default_size, sizes, reads, files}]
    open:new Set(),     // ids of expanded rows - they stay open across a refresh
  };

  /* Reads and paints the list; returns it, or null if the read failed. */
  async function loadApps(){
    let read = null;
    try{
      const apps = await api.apps();
      read = appsList.apps = Array.isArray(apps) ? apps : [];
      appsList.status = 'ready';
    }catch(e){
      // A failed refresh leaves the list already shown.
      if(!appsList.apps) appsList.status = 'error';
    }
    paintApps();
    return read;
  }

  /* The controls card. Nothing in it depends on the list, so it's
     painted once, at boot. Its message line stays empty until an
     install has something to say (appsNote). */
  function paintAppControls(){
    const card = $('#appsCard');
    card.innerHTML = '';
    card.appendChild(cardTitle('Applications', 'apps'));
    card.appendChild(appActionsRow());
    const note = el('div','form-msg app-msg');
    note.id = 'appsMsg';
    note.setAttribute('role','status');
    card.appendChild(note);
  }

  /* A line on the controls card: good news fades, a problem stays. */
  let appsNoteTimer = null;
  function appsNote(cls, text){
    const note = $('#appsMsg');
    clearTimeout(appsNoteTimer);
    note.className = 'form-msg app-msg ' + cls;
    note.textContent = text;
    if(cls === 'ok') appsNoteTimer = setTimeout(() => { note.textContent = ''; }, 4000);
  }

  /* The list, under the controls card, in Your data's shape: a container
     of rows, each an item that will hold its detail once rows expand. */
  function paintApps(){
    const card = $('#appListCard');
    card.innerHTML = '';

    if(appsList.status==='loading'){
      card.appendChild(el('div','dstate','Loading your applications…'));
    }else if(appsList.status==='error'){
      const box = el('div','dstate',
        `Couldn't load your applications.
         <div style="margin-top:12px;"><button class="btn sm" type="button">Retry</button></div>`);
      box.querySelector('button').onclick = () => { appsList.status = 'loading'; paintApps(); loadApps(); };
      card.appendChild(box);
    }else if(!appsList.apps.length){
      card.appendChild(el('div','dstate','No applications installed'));
    }else{
      const list = el('div','alist');
      appsList.apps.forEach(a => list.appendChild(appRow(a)));
      card.appendChild(list);
    }
  }

  /* An installed app: its name, opening onto its detail. /api/apps lists
     only the apps that load, with no status of their own, so there's
     none to show yet. */
  const appPanelId = a => 'app-panel-' + String(a.id).replace(/[^a-z0-9_-]/gi, '-');
  function appRow(a){
    const item = el('div','ditem aitem');
    item.dataset.app = a.id;
    const head = el('button','drow arow',
      `<span class="chev" aria-hidden="true">›</span><span class="a-name">${esc(a.name || a.id)}</span>`);
    return expandable(item, head, {
      open:appsList.open, id:a.id, panelId:appPanelId(a), panel:() => appPanel(a),
    });
  }

  /* An open row: Reads · Files · Writes, then the actions. */
  function appPanel(a){
    const name = a.name || a.id;
    const reads = Array.isArray(a.reads) ? a.reads : [];
    const files = Array.isArray(a.files) ? a.files : [];
    // A key the app invents is named by the label it declares.
    const own = Array.isArray(a.metrics) ? a.metrics : [];
    const readName = k => (own.find(m => m.key===k) || {}).label || metricName(k);
    const p = el('div','dpanel apanel', `
      <div>
        <h5>Reads</h5>
        ${reads.length
          ? `<ul class="akeys">${reads.map(k => `<li class="akey" data-tip="${esc(readName(k))}">${esc(k)}</li>`).join('')}</ul>`
          : '<p class="dnote">No declared reads</p>'}
      </div>
      <div>
        <h5>Files</h5>
        ${files.length
          ? `<ul class="akeys">${files.map((f, i) =>
              `<li><button class="afile" type="button" data-file="${i}" aria-haspopup="dialog">${esc(f)}</button></li>`).join('')}</ul>`
          : '<p class="dnote">No files</p>'}
      </div>
      <div>${writesTicker()}</div>
      <div class="a-acts">
        <button class="btn sm" data-act="refresh" type="button">Refresh</button>
        <span class="a-acts-end">
          <button class="btn sm" data-act="update" type="button" aria-haspopup="dialog">Update</button>
          <button class="btn sm" data-act="duplicate" type="button" aria-haspopup="dialog">Duplicate</button>
          <button class="btn sm danger" data-act="uninstall" type="button">Uninstall</button>
        </span>
      </div>
      <div class="danger-panel a-confirm" hidden>
        <h5>Uninstall ${esc(name)}?</h5>
        <p>This deletes its files from <code>/data/apps/</code>.</p>
        <div class="modal-actions">
          <button class="btn sm" data-act="cancel" type="button">Cancel</button>
          <button class="btn sm danger solid" data-act="confirm" type="button">Uninstall</button>
        </div>
      </div>
      <div class="form-msg a-msg" role="status"></div>`);
    p.id = appPanelId(a);

    const act = k => p.querySelector(`[data-act="${k}"]`);
    const acts = p.querySelector('.a-acts'), gate = p.querySelector('.a-confirm');
    const msg = p.querySelector('.a-msg');
    let msgTimer = null;
    // A line under the actions: good news fades, a problem stays.
    const say = (cls, text) => {
      clearTimeout(msgTimer);
      msg.className = 'form-msg a-msg ' + cls;
      msg.textContent = text;
      if(cls === 'ok') msgTimer = setTimeout(() => { msg.textContent = ''; }, 4000);
    };

    p.querySelectorAll('.afile').forEach(b => { b.onclick = () => openAppFile(a, files[+b.dataset.file]); });

    /* Refresh: the app's render, re-run against the data as it is now
       with its tile's config, and its Home tile redrawn from the fresh
       spec - nothing else. */
    const refresh = act('refresh');
    refresh.onclick = async () => {
      refresh.disabled = true;
      say('', '');
      let spec;
      try{ spec = await api.renderApp(a.id, tileCfg(a.id)); }
      catch(e){ say('bad', `Couldn't refresh ${name}.`); refresh.disabled = false; return; }
      repaintTile(a.id, spec);
      refresh.disabled = false;
      if(spec && spec.type === 'error') say('bad', 'Its render failed: ' + (spec.message || 'no message'));
      else say('ok', '✓ Refreshed');
    };

    /* Every one of the app's files, read back through the file route -
       [{name, text}], for Update and Duplicate to open the popup on - its
       button off meanwhile. A file that can't be read stops it, said in
       the row: null. */
    const readBack = async (btn, verb) => {
      btn.disabled = true;
      say('', '');
      const read = await Promise.all(files.map(f => api.appFile(a.id, f)));
      btn.disabled = false;
      const unread = (file, why) => {
        say('bad', `Couldn't read ${file}${why ? ` (${why})` : ''} — can't ${verb} ${name}.`);
        return null;
      };
      const bad = read.findIndex(res => !res.ok);
      if(bad >= 0) return unread(files[bad], read[bad].error);
      // An empty file is read, empty.
      const got = files.map((f, i) => ({name:f, text:typeof read[i].text === 'string' ? read[i].text : ''}));
      return got.some(x => x.name === 'app.yaml') ? got : unread('app.yaml', 'not a plain file in its folder');
    };

    /* Update: this app's files - every one read back - opened in the Add
       popup to change and apply in place: the same id, its data kept.
       Nothing is written until Update there, past its confirm. */
    const upd = act('update');
    upd.onclick = async () => {
      const current = await readBack(upd, 'update');
      if(current) openAddApp(current, null, a);
    };

    /* Duplicate: a new app from this one's files - every one read back,
       its app.yaml given the next free id and name - opened in the Add
       popup to review and install like any other. A file that can't be
       read stops it; nothing is written until Install there. */
    const dupe = act('duplicate');
    dupe.onclick = async () => {
      const copy = await readBack(dupe, 'duplicate');
      if(!copy) return;
      const manifest = copy.find(x => x.name === 'app.yaml');
      const to = dupeTarget(a, appsList.apps || []);
      manifest.text = bumpManifest(manifest.text, to.id, to.name);
      openAddApp(copy, name);
    };

    /* Uninstall: a confirm, then DELETE - and the app goes from this list
       and from Home. */
    const gateOpen = open => {
      acts.hidden = open;
      gate.hidden = !open;
      say('', '');
      (open ? act('cancel') : act('uninstall')).focus();
    };
    act('uninstall').onclick = () => gateOpen(true);
    act('cancel').onclick = () => gateOpen(false);
    const confirmBtn = act('confirm');
    confirmBtn.onclick = async () => {
      confirmBtn.disabled = true; confirmBtn.textContent = 'Uninstalling…';
      const res = await api.uninstallApp(a.id);
      if(res.ok){
        appsList.open.delete(a.id);
        appsNote('ok', `✓ Uninstalled ${name}`);
        loadApps();
        loadHome();
        loadAppSources();   // what it wrote stays - orphaned now
      }else{
        say('bad', res.error || 'Could not uninstall this application');
        confirmBtn.disabled = false; confirmBtn.textContent = 'Uninstall';
      }
    };
    return p;
  }

  /* Day / Wk / Mth - Your data's continuity columns - each "—" for now:
     the slot is the layout, nothing is counted yet. */
  // writes-ticker: filled in when app-tier write-back exists
  function writesTicker(){
    return `<h5>Writes</h5>
      <div class="rhs aticks" role="img" aria-label="Writes: none yet" data-tip="writes: none yet">${
        ['Day', 'Wk', 'Mth'].map(l =>
          `<span class="rh-cell"><span class="atick-l">${l}</span><span class="atick-v">—</span></span>`).join('')
      }</div>`;
  }

  /* One of an app's files, read-only: its text from the server, set as
     text - never markup - in a monospace block. */
  function openAppFile(a, name){
    const {box, close} = openModal(`
      <h4><code>${esc(name)}</code></h4>
      <p class="hint">${esc(a.name || a.id)} · read-only</p>
      <pre class="file-view" tabindex="0" aria-label="${esc(name)}">Loading…</pre>
      <div class="form-msg src-msg" data-f="msg" role="alert"></div>
      <div class="modal-actions">
        <button class="btn sm" data-act="close" type="button">Close</button>
      </div>`);
    box.classList.add('wide');
    const view = box.querySelector('.file-view');
    const msg = box.querySelector('[data-f="msg"]');
    const btn = box.querySelector('[data-act="close"]');
    btn.onclick = close;
    btn.focus();
    api.appFile(a.id, name).then(res => {
      if(res.ok && res.text){ view.textContent = res.text; return; }
      view.hidden = true;
      msg.className = 'form-msg src-msg ' + (res.ok ? 'info' : 'bad');
      msg.textContent = res.ok ? 'This file is empty.' : (res.error || "Couldn't read this file.");
    });
  }

  /* The controls card's buttons, Add Application in Add source's style,
     then the other ways to get one, grouped at the far end - those
     three still placeholders. */
  const APP_ACTIONS = [
    ['browse', 'Browse', 'Browse applications'],
    ['build',  'Build',  'Build an application'],
    ['create', 'Create', 'Create an application'],
  ];
  function appActionsRow(){
    const button = (act, label, title) => {
      const b = el('button','btn sm', esc(label));
      b.type = 'button';
      b.dataset.act = act;
      b.setAttribute('aria-haspopup','dialog');
      b.onclick = () => comingSoon(title);
      return b;
    };
    const wrap = el('div','app-actions');
    const add = button('add-app', '＋ Add Application', 'Add an application');
    add.onclick = () => openAddApp();
    wrap.appendChild(add);
    const group = el('div','app-tools');
    group.setAttribute('role','group');
    group.setAttribute('aria-label','Other ways to get an application');
    APP_ACTIONS.forEach(([act, label, title]) => group.appendChild(button(act, label, title)));
    wrap.appendChild(group);
    return wrap;
  }

  /* =========================================================
     ADD APPLICATION - the popup that installs one
     An app is a folder of files, so the popup builds one: a slot per
     file, each a paste box with Upload beside it - two ways to fill
     the same slot. app.yaml is required and app.py optional; ＋ Add
     file adds a named slot for anything else the app reads. Review
     shows what's about to be installed: the id, read from the
     app.yaml (there's no id field of its own), the files, and - when
     any is Python - that it's custom code. Install POSTs the files to
     /api/apps, the one write here - or, opened by an app row's Update,
     the popup is that app's update: its files to start with, its id
     locked, Review the confirm, and Update PUTs them to /api/apps/<id>
     in place of the app's own, which keeps its data.
     The checks below mirror the server's (app/apps.py) for quick
     feedback, and that's all they are: the server re-checks
     everything, and a refusal - a taken id, an app.yaml that doesn't
     parse - shows in the popup as it's given.
     ========================================================= */
  /* An app id: lowercase letters, digits and '-', starting with a
     letter or digit - the server's INSTALL_ID. */
  const INSTALL_ID = /^[a-z0-9][a-z0-9-]*$/;
  const CUSTOM_CODE = 'This app includes custom code and runs with full access to your OpenFit data.';

  /* Why a name can't be a file in the app's folder, or '' - the
     server's filename_problem(): a plain name, no '/', '\', '..' or
     control character. */
  function fileNameProblem(name){
    if(!name) return 'Every file needs a name.';
    if(/[\/\\]/.test(name) || name.includes('..') || name === '.')
      return `"${name}" isn't a plain file name: no "/", "\\" or "..".`;
    if(/[\x00-\x1f\x7f]/.test(name)) return `"${name}" has a control character in it.`;
    return '';
  }

  /* The id in an app.yaml: {id}, or {problem} saying why there isn't
     one. Read as the top-level `id:` line - the last, as YAML keeps -
     without a YAML parser, so it's a preview: the server parses the
     file properly, and its parse error is the one that counts. */
  const NO_ID = 'No id in app.yaml: it needs a line like  id: my-app';
  function manifestId(text){
    return yamlId(text, v => INSTALL_ID.test(v) ? ''
      : `"${v}" isn't a valid id: lowercase letters, digits and "-", starting with a letter or digit.`);
  }

  /* An update's id, read as manifestId reads it: {id}, or {problem}. It
     must be keep, the app's own - whatever its form, a hand-placed app's
     capitals and '_' included - as the server holds it. */
  function updateId(text, keep){
    return yamlId(text, v => v === keep ? ''
      : `This updates "${keep}", but app.yaml's id is "${v}": an update keeps the app's id. `
        + 'Duplicate makes a copy under a new one.');
  }

  /* The value of an app.yaml's last top-level `id:` line, unquoted, held
     to check - why it won't do, or '' - as {id} or {problem}. */
  function yamlId(text, check){
    if(!text.trim()) return {problem:'app.yaml is empty: paste or upload it first.'};
    const lines = text.split(/\r?\n/).filter(l => /^id[ \t]*:([ \t]|$)/.test(l));
    if(!lines.length) return {problem:NO_ID};
    let v = lines[lines.length-1].replace(/^id[ \t]*:/, '').trim();
    const q = v[0];
    if(q === '"' || q === "'"){
      const end = v.indexOf(q, 1);
      if(end < 0) return {problem:"app.yaml doesn't parse: the id's quote isn't closed."};
      v = v.slice(1, end);
    }else{
      v = v.replace(/(^|[ \t])#.*$/, '').trim();   // a comment after it
    }
    if(!v) return {problem:NO_ID};
    const problem = check(v);
    return problem ? {problem} : {id:v};
  }

  /* A duplicate's id and name: {id, name}. Copies of an app stay in step,
     numbered from 2 - the lowest n with neither <id>-n nor "<name> n"
     installed - and a copy of a copy counts on from the same base, so
     "Steps 2" bases to "Steps". The base id is put in INSTALL_ID's form
     (a hand-placed app can have capitals or '_'), so the id is one an
     install takes - and the server re-checks it anyway. */
  function dupeTarget(app, installed){
    const name = String(app.name || app.id);
    const baseName = name.replace(/\s+\d+$/, '') || name;
    const baseId = String(app.id).replace(/-\d+$/, '').toLowerCase().replace(/_/g, '-');
    const ids = new Set(installed.map(a => a.id));
    const names = new Set(installed.map(a => a.name));
    let n = 2;
    while(ids.has(`${baseId}-${n}`) || names.has(`${baseName} ${n}`)) n++;
    return {id:`${baseId}-${n}`, name:`${baseName} ${n}`};
  }

  /* An app.yaml with its id and name replaced, the rest as written. Read
     as manifestId reads it - the last top-level `id:` line, and `name:`
     likewise - so it's a line edit, not a parse: the popup shows the
     result to edit, and the server parses it on Install. The name is
     double-quoted, escaped, so any name is one YAML string. With no
     name line (it defaults to the id) one goes in under the id's; with
     no id line (it defaulted to the folder's name), one goes in above
     the first top-level key. Line endings kept. */
  function bumpManifest(text, id, name){
    const lines = text.split('\n');
    const eol = l => l.endsWith('\r') ? '\r' : '';
    const last = key => {
      for(let i = lines.length-1; i >= 0; i--) if(key.test(lines[i])) return i;
      return -1;
    };
    const quoted = '"' + name.replace(/[\\"]/g, c => '\\' + c)
      .replace(/[\x00-\x1f\x7f-\x9f\u2028\u2029]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')) + '"';
    let at = last(/^id[ \t]*:([ \t]|$)/);
    if(at >= 0){
      lines[at] = `id: ${id}` + eol(lines[at]);
    }else{
      at = Math.max(0, lines.findIndex(l => /^[A-Za-z_][\w-]*[ \t]*:([ \t]|$)/.test(l)));
      lines.splice(at, 0, `id: ${id}` + eol(lines[at] || ''));
    }
    const named = last(/^name[ \t]*:([ \t]|$)/);
    if(named >= 0) lines[named] = `name: ${quoted}` + eol(lines[named]);
    else lines.splice(at+1, 0, `name: ${quoted}` + eol(lines[at]));
    return lines.join('\n');
  }

  /* One file's slot. app.yaml and app.py have their names set; an added
     slot (fixed '') has a name field and a Remove button. Upload reads
     the chosen file into the paste box - and, in an added slot, its
     name into an empty name field. Text files: what's installed is text.
     prefill, {name, text} or null, fills it to start with (a duplicate's
     files): the box with its text, an added slot's name field with its
     name - as values, never markup. */
  function fileSlot(fixed, required, say, prefill){
    const PLACEHOLDER = {
      'app.yaml': 'id: my-app&#10;name: My app&#10;sizes: [{w: 1, h: 1}]',
      'app.py':   'def render(ctx, cfg):&#10;    return ctx.empty(&quot;Nothing yet&quot;)',
    };
    const slot = el('div','fslot', `
      <div class="fslot-h">
        ${fixed
          ? `<span class="fslot-name">${esc(fixed)}</span>
             <span class="fslot-tag">${required ? 'Required' : 'Optional'}</span>`
          : `<input class="input fname" type="text" aria-label="File name"
                    placeholder="file name"
                    autocomplete="off" autocapitalize="off" spellcheck="false">`}
        <span class="fslot-btns">
          <button class="btn sm" data-act="upload" type="button">Upload</button>
          ${fixed ? '' : '<button class="btn sm" data-act="remove" type="button">Remove</button>'}
        </span>
        <input type="file" hidden>
      </div>
      <textarea class="input" rows="6" wrap="off" spellcheck="false" autocomplete="off"
                autocapitalize="off" aria-label="${fixed ? esc(fixed) : 'File'} contents"
                placeholder="${fixed ? PLACEHOLDER[fixed] : 'Paste the file, or upload it'}"></textarea>`);
    if(fixed) slot.dataset.file = fixed;

    const picker = slot.querySelector('input[type="file"]');
    const text = slot.querySelector('textarea');
    const name = slot.querySelector('.fname');
    if(prefill){
      text.value = prefill.text;
      if(name) name.value = prefill.name;
    }
    slot.querySelector('[data-act="upload"]').onclick = () => picker.click();
    picker.onchange = async () => {
      const file = picker.files && picker.files[0];
      picker.value = '';   // so the same file can be picked again
      if(!file) return;
      try{ text.value = await file.text(); }
      catch(e){ say(`Couldn't read ${file.name}.`); return; }
      if(name && !name.value.trim()) name.value = file.name;
    };
    const remove = slot.querySelector('[data-act="remove"]');
    if(remove) remove.onclick = () => slot.remove();
    return slot;
  }

  /* The slots as files to install, [{name, text}] - or the first
     problem, and its slot. app.yaml always goes (empty, Review says
     so); app.py and an added slot left blank don't. */
  function slotFiles(box){
    const files = [], seen = new Set();
    for(const slot of box.querySelectorAll('.fslot')){
      const fixed = slot.dataset.file || '';
      const text = slot.querySelector('textarea').value;
      const name = fixed || slot.querySelector('.fname').value.trim();
      if(fixed === 'app.py' && !text.trim()) continue;
      if(!fixed && !name && !text) continue;
      const problem = fixed ? '' : fileNameProblem(name);
      if(problem) return {problem, slot};
      if(seen.has(name)) return {problem:`Two files are named "${name}".`, slot};
      seen.add(name);
      files.push({name, text});
    }
    return {files};
  }

  /* The popup, in two steps: the files, then Review - what's about to
     be installed - and Install. prefill, [{name, text}], starts it on
     those files rather than empty slots - a duplicate of the app named
     copyOf: its app.yaml and app.py in their slots, an added slot for
     each of the rest - all of it editable before Review. update, an
     installed app ({id, name}), makes it that app's update, prefilled
     with its files: its id shown locked, and held to by Review; no tab
     to pick (it's placed already); and Review the confirm - "Update
     <name>?" - whose Update replaces the app's files with these. */
  function openAddApp(prefill, copyOf, update){
    const given = Array.isArray(prefill) ? prefill : null;
    const updName = update ? update.name || update.id : '';
    const hint = update
      ? `<p class="hint">The files of <b>${esc(updName)}</b>, as installed. Change any of them, add
          one or remove one, then review the update: these become its files — a file whose slot
          you remove is deleted — and what it has written is kept.</p>
         <p class="install-id" data-f="locked">Application: <code>${esc(update.id)}</code>
          <span class="fslot-tag">Locked</span></p>`
      : given
      ? `<p class="hint">A copy of <b>${esc(copyOf)}</b>: its files, with a new <code>id</code> and
          <code>name</code> in its <code>app.yaml</code>. Change anything here, then review and
          install it — a separate application, with its own settings.</p>`
      : `<p class="hint">An application is a folder of files: its <code>app.yaml</code> manifest,
          an <code>app.py</code> if it computes anything, and any files it reads. Paste each
          one, or upload it.</p>`;
    const verb = update ? 'Update' : 'Install';
    const {box, close} = openModal(`
      <h4>${update ? 'Update application' : given ? 'Duplicate application' : 'Add an application'}</h4>
      <div data-step="files">
        ${hint}
        <div class="fslots"></div>
        <button class="btn sm" data-act="add-file" type="button">＋ Add file</button>
      </div>
      <div data-step="confirm" hidden>
        <p class="install-id" data-f="id"></p>
        <div class="field install-tab" data-f="tabField" hidden>
          <label for="installTab">Add to tab</label>
          <select class="input" id="installTab" data-f="tab"></select>
        </div>
        <ul class="install-files" data-f="files" aria-label="Files"></ul>
        <p class="install-warn" data-f="notice" hidden>${esc(CUSTOM_CODE)}</p>
        ${update
          ? `<div class="danger-panel update-sure" data-f="sure">
              <h5>Update ${esc(updName)}?</h5>
              <p>This replaces the app's files. Its data is kept.</p>
            </div>`
          : ''}
      </div>
      <div class="form-msg bad src-msg" data-f="msg" role="alert"></div>
      <div class="modal-actions">
        <button class="btn sm" data-act="cancel" type="button">Cancel</button>
        <button class="btn sm" data-act="back" type="button" hidden>Back</button>
        <button class="btn sm primary" data-act="review" type="button">Review</button>
        <button class="btn sm primary" data-act="install" type="button" hidden>${verb}</button>
      </div>`);
    box.classList.add('wide');

    const f = k => box.querySelector(`[data-f="${k}"]`);
    const act = a => box.querySelector(`[data-act="${a}"]`);
    const slots = box.querySelector('.fslots');
    const install = act('install');
    const say = text => { f('msg').textContent = text; };
    let files = null;   // what Review settled on, and Install sends

    const prefilled = n => given && given.find(x => x.name === n) || null;
    slots.appendChild(fileSlot('app.yaml', true, say, prefilled('app.yaml')));
    slots.appendChild(fileSlot('app.py', false, say, prefilled('app.py')));
    if(given) given.filter(x => x.name !== 'app.yaml' && x.name !== 'app.py')
      .forEach(x => slots.appendChild(fileSlot('', false, say, x)));
    act('add-file').onclick = () => {
      const slot = fileSlot('', false, say);
      slots.appendChild(slot);
      slot.querySelector('.fname').focus();
    };
    act('cancel').onclick = close;

    function show(step){
      const review = step === 'confirm';
      box.querySelector('[data-step="files"]').hidden = review;
      box.querySelector('[data-step="confirm"]').hidden = !review;
      act('review').hidden = review;
      act('back').hidden = install.hidden = !review;
      say('');
    }

    act('review').onclick = () => {
      const got = slotFiles(box);
      if(got.problem){
        say(got.problem);
        const name = got.slot.querySelector('.fname');
        if(name) name.focus();
        return;
      }
      files = got.files;
      const yamlText = files.find(x => x.name === 'app.yaml').text;
      const read = update ? updateId(yamlText, update.id) : manifestId(yamlText);
      const idLine = f('id');
      idLine.classList.toggle('bad', !read.id);
      if(read.id) idLine.innerHTML = `${verb} application: <code>${esc(read.id)}</code>`;
      else idLine.textContent = read.problem;
      f('files').innerHTML = files.map(x => `<li><code>${esc(x.name)}</code></li>`).join('');
      f('notice').hidden = !files.some(x => /\.py$/i.test(x.name));
      // Which of Home's tabs it goes on - asked only when there's a
      // choice, the layout's default tab picked to start with. Not while
      // Configure is on: its save, of a working copy without the app,
      // would put it on the tab on screen whatever was picked - so it
      // joins that tab, to be moved like any tile. Nor for an update: the
      // app is placed already, and stays where it is.
      const tabs = home.layout && Array.isArray(home.layout.tabs) ? home.layout.tabs : [];
      if(tabs.length > 1 && !home.configuring && !update){
        f('tab').innerHTML = tabs.map(t =>
          `<option value="${esc(t.id)}"${t.id===home.layout.default_tab ? ' selected' : ''}>${esc(t.name)}</option>`).join('');
        f('tabField').hidden = false;
      }else{
        f('tabField').hidden = true;
      }
      install.disabled = !read.id;
      // An update's confirm, asked only of an update that can go ahead.
      if(update) f('sure').hidden = !read.id;
      show('confirm');
      (read.id ? install : act('back')).focus();
    };
    act('back').onclick = () => show('files');

    install.onclick = async () => {
      say('');
      install.disabled = true; install.textContent = update ? 'Updating…' : 'Installing…';
      const body = {};
      files.forEach(x => { body[x.name] = x.text; });
      // An update replaces the app's files with these, in place.
      const res = update ? await api.updateApp(update.id, body) : await api.installApp(body);
      if(res.ok){
        // The tab picked, if there was a choice (null: the default's).
        const tabId = f('tabField').hidden ? null : f('tab').value;
        close();
        if(tabId) await placeNewAppOnTab(res.id, tabId);
        appInstalled(res, update ? 'Updated' : 'Installed');
      }else{
        // The server's own refusal - a taken id, a parse error, an update
        // that doesn't load - as-is.
        say(res.error || `Could not ${verb.toLowerCase()} this application`);
        install.disabled = false; install.textContent = verb;
      }
    };

    box.querySelector('textarea').focus();
  }

  /* After an install or an update (done says which), the list and Home
     are re-read at once, so the app shows - drawn by its new code -
     without a reload. If the scanner didn't take it (a malformed app
     installs, then is skipped and logged), the controls card says so -
     the list alone wouldn't. */
  async function appInstalled(res, done){
    loadHome();
    loadAppSources();   // an app back under its old id owns its data again
    const listed = await loadApps();
    const app = listed && listed.find(a => a.id === res.id);
    if(listed && !app) appsNote('bad', `${done} "${res.id}", but it doesn't load: the server's log says why.`);
    else appsNote('ok', `✓ ${done} ${app ? (app.name || app.id) : res.id}`);
  }

  /* =========================================================
     HOME - the installed apps' tiles
     Each app (a folder in the server's apps directory) renders a
     display spec server-side (app/host.py); this page only draws
     specs. The saved layout is a set of tabs, each a flow of
     instances (an app placed, with its own size and config): the tab
     strip shows them, before Data, and Home draws the one picked. The
     parts, kept apart so the layout can change without touching the
     others:
       loadHome()   the fetch: the apps, their specs and the layout
                    -> home.specs, home.layout; then the render
       renderActiveTab()  the render, from what the fetch left - a
                    tab switch fetches nothing - for the tab on screen
                    -> home.tiles: [{instance_id, app_id, name, spec,
                                     w, h, sizes, config}]
       layoutTiles  the tab's saved instances over the apps installed
                    now: the tiles' order, and each one's size
       paintTiles() any such list -> the tiles on the six-cell grid,
                    each spec drawn by renderSpec()
       paintTabStrip()  the layout's tabs, on the strip
     The layout is flow: an order and a size per tile, no cells. The
     grid (CSS) lays them out, row by row. Configure, in the sub-header
     under the tab strip, edits home.layout as a working copy: drag a
     tile to move it, pick its size from its app's, or move it to
     another tab; edit the subtitle; make, rename and delete tabs. The
     tab on screen's edits are in home.tiles and home.subtitle until
     they're flushed into the copy (flushTab) - on every switch, and
     before the save - and it's all saved, every tab, as Configure is
     switched off. Every app is on one tab: a tile moves, never copies,
     so tiles are still keyed by app_id.
     ========================================================= */
  const GRID_COLS = 6;          // the grid's width in cells, and the most a tile spans either way
  const SUBTITLE_MAX = 120;     // the server's MAX_SUBTITLE (home_layout.py)
  const TAB_NAME_MAX = 40;      // the server's MAX_TAB_NAME (home_layout.py)
  const home = {
    status:'loading',   // loading | ready | error
    layout:null,        // the layout, {tabs, default_tab}: as read, then Configure's working copy
    specs:null,         // app_id -> {a, spec}: the apps installed, in folder order, each with its spec
    activeTab:null,     // the id of the layout's tab Home shows
    tiles:null,         // its [{instance_id, app_id, name, spec, w, h, sizes, config}], in layout order; w/h in cells
    subtitle:'',        // its line in the sub-header
    configuring:false,  // Configure is on: tiles move and resize, the subtitle edits, tabs come and go
    saving:false,       // Configure's save is on its way
  };
  const cells = n => Math.min(GRID_COLS, Math.max(1, Math.round(+n) || 1));
  const sizeOf = s => ({w:cells(s && s.w), h:cells(s && s.h)});
  /* The sizes an app's tile can be drawn at - its manifest's, the
     default first. The page never makes one up. */
  const appSizes = a => (Array.isArray(a.sizes) && a.sizes.length ? a.sizes : [a.default_size]).map(sizeOf);

  /* The fetch: the apps, the layout and a spec each - rendered with its
     instance's config - then Home drawn from them (renderActiveTab).
     Re-run after a sync, an install or an uninstall, and after
     Configure saves - not on a tab switch. */
  async function loadHome(){
    let read = false;
    try{
      const [apps, saved] = await Promise.all([api.apps(), api.homeLayout()]);
      // Each app rendered with its instance's config: mid-Configure the
      // working copy's - the tab on screen flushed into it first, so a
      // setting not saved yet holds - else the saved layout's.
      const editing = !!(home.configuring && home.layout);
      if(editing) flushTab();
      const cfgs = cfgByApp(editing ? home.layout : saved);
      // An app that can't be fetched is one error tile, not a failed Home.
      const specs = await Promise.all(apps.map(a => api.renderApp(a.id, cfgs.get(a.id) || {})
        .catch(() => ({type:'error', message:"Couldn't load this app."}))));
      home.specs = new Map(apps.map((a, i) => [a.id, {a, spec:specs[i]}]));
      // Mid-Configure the layout holds edits not saved yet: it's kept -
      // the tab on screen as it stands - and squared with the apps as
      // they are now when it's drawn, not replaced.
      if(home.configuring && home.layout) flushTab();
      else home.layout = saved;
      home.status = 'ready';
      read = true;
    }catch(e){
      // A failed refresh leaves the tiles already drawn.
      if(!home.tiles) home.status = 'error';
    }
    if(read) renderActiveTab();
    else if(home.status==='error'){ paintHomeHead(); paintHome(); }
  }

  /* The render, from memory: the tab on screen - home.activeTab, or the
     default if that names no tab (none picked yet, or one since
     deleted) - its instances squared with the apps (layoutTiles) into
     home.tiles, its subtitle, then the sub-header, the tiles and the
     strip. */
  function renderActiveTab(){
    const tabs = home.layout.tabs;
    const tab = tabs.find(t => t.id===home.activeTab) || tabs.find(t => t.id===home.layout.default_tab) || tabs[0];
    home.activeTab = tab.id;
    const apps = Array.from(home.specs.values(), s => s.a);
    // The apps the other tabs place: placed already, not this tab's to add.
    const elsewhere = tabs.filter(t => t!==tab).flatMap(t => t.items.map(it => it.app_id));
    home.tiles = layoutTiles(tab.items, apps, elsewhere).map(it => {
      const {a, spec} = home.specs.get(it.app_id);
      return {instance_id:it.instance_id, app_id:a.id, name:a.name, spec,
        w:it.size.w, h:it.size.h, sizes:appSizes(a), config:it.config};
    });
    home.subtitle = typeof tab.subtitle==='string' ? tab.subtitle : '';
    paintHomeHead();
    paintHome();
    paintTabStrip();
  }

  /* A layout tab picked on the strip: Home shows it. Mid-Configure the
     tab being left is flushed first, so its edits go with the save.
     Before the layout is read there's nothing to draw: the read draws
     this tab, or the default if it's no tab. */
  function switchTab(id){
    if(home.configuring) flushTab();
    home.activeTab = id;
    showPanel('home');
    if(home.layout && home.specs) renderActiveTab();
  }

  /* Configure's edits to the tab on screen - its tiles' order and sizes,
     and its subtitle - written back into the working copy: before a
     switch, a move, a delete, and the save. */
  function flushTab(){
    const tab = home.layout && home.tiles ? home.layout.tabs.find(t => t.id===home.activeTab) : null;
    if(!tab) return;
    tab.items = layoutItems();
    tab.subtitle = home.subtitle;
  }

  /* Flow, for the tab on screen: its saved instances in their order,
     each with its id and config, at its saved size if its app still
     offers that size, else at the app's default; one whose app is gone
     is dropped. An app placed nowhere - not here, and not among
     `elsewhere`, the apps the other tabs place - goes on the end at its
     default, with no instance id yet (the save mints one). The server
     hands the layout out squared this way (home_layout.py); this
     squares it again with the apps read beside it, and an unsaved
     Configure with an install or uninstall made meanwhile. A tab's
     tiles are still one an app here (a repeat is dropped): nothing on
     the page places an app twice yet.
     -> [{instance_id, app_id, size:{w, h}, config}] */
  function flowLayout(items, apps, elsewhere){
    const byId = new Map(apps.map(a => [a.id, a]));
    const others = new Set(elsewhere || []);
    const isConfig = c => !!c && typeof c==='object' && !Array.isArray(c);
    const placed = new Set(), out = [];
    (Array.isArray(items) ? items : []).forEach(it => {
      const a = it && typeof it.app_id==='string' ? byId.get(it.app_id) : null;
      if(!a || placed.has(a.id)) return;
      placed.add(a.id);
      const sizes = appSizes(a), want = it.size || {};
      out.push({instance_id:typeof it.instance_id==='string' ? it.instance_id : undefined, app_id:a.id,
        size:sizes.find(s => s.w===want.w && s.h===want.h) || sizes[0], config:isConfig(it.config) ? it.config : {}});
    });
    apps.forEach(a => {
      if(!placed.has(a.id) && !others.has(a.id)) out.push({instance_id:undefined, app_id:a.id, size:appSizes(a)[0], config:{}});
    });
    return out;
  }
  const layoutTiles = flowLayout;

  /* The tab on screen as the server stores it: its instances, in order.
     One with no id yet sends none (JSON leaves an undefined out), and
     the server mints it one. */
  const layoutItems = () => home.tiles.map(t => ({instance_id:t.instance_id, app_id:t.app_id, size:{w:t.w, h:t.h}, config:t.config || {}}));

  /* Each app's config, as a layout places it: app_id -> its instance's
     config, the values its render is given (the first instance, in tab
     order, should a layout from elsewhere place an app twice). */
  function cfgByApp(layout){
    const cfgs = new Map();
    layout.tabs.forEach(tab => tab.items.forEach(it => {
      if(!cfgs.has(it.app_id)) cfgs.set(it.app_id, it.config || {});
    }));
    return cfgs;
  }
  /* The config an app's tile renders with now: its tile's on screen -
     mid-Configure, it may hold a setting not flushed yet - else its
     instance's in the layout; {} before the layout is read. */
  function tileCfg(appId){
    const t = home.tiles && home.tiles.find(x => x.app_id===appId);
    if(t) return t.config || {};
    return (home.layout && cfgByApp(home.layout).get(appId)) || {};
  }
  /* An app's config fields - its manifest's, in order: the schema its
     tile's settings form is built from. None, no form. */
  function configFields(appId){
    const s = home.specs && home.specs.get(appId);
    return s && Array.isArray(s.a.config) ? s.a.config : [];
  }

  function paintHome(){
    const box = $('#home');
    if(home.status==='loading'){
      box.innerHTML = '<p class="home-state">Loading apps…</p>';
    }else if(home.status==='error'){
      box.innerHTML = `<div class="home-state">Couldn't load your apps.<br>
        <button class="btn sm" type="button">Retry</button></div>`;
      box.querySelector('button').onclick = () => { home.status = 'loading'; paintHomeHead(); paintHome(); loadHome(); };
    }else if(!home.specs.size){
      box.innerHTML = `<p class="home-state">No apps installed yet. Add one with ＋ Add Application
        on the Data tab, or put its folder in the server's apps directory (<code>/data/apps</code>
        by default) and reload.</p>`;
    }else if(!home.tiles.length){
      box.innerHTML = home.configuring
        ? '<p class="home-state">Nothing on this tab yet. Move a tile here from another tab, with its Move… picker.</p>'
        : '<p class="home-state">Nothing on this tab yet. Configure, then move a tile here from another tab.</p>';
    }else{
      paintTiles(box, home.tiles, home.configuring);
    }
    releaseTimelines();   // the faces just replaced
  }

  /* tiles: [{app_id, name, spec, w, h, sizes}], w/h in cells. Each spans
     its size; the grid places them in order, row by row. configuring
     gives each its handle and, if it has a choice, its size picker, and
     lets them be dragged into a new order. */
  function paintTiles(box, tiles, configuring){
    const grid = el('div','tiles' + (configuring ? ' configuring' : ''));
    tiles.forEach(t => {
      const tile = el('section','tile');
      tile.dataset.app = t.app_id;
      tile.setAttribute('aria-label', t.name || t.app_id);
      spanTile(tile, t);
      tile.appendChild(renderSpec(t.spec, t.name, t.app_id));
      if(configuring) tile.appendChild(tileControls(t, tile));
      grid.appendChild(tile);
    });
    if(configuring) sortableTiles(grid);
    box.replaceChildren(grid);
  }
  /* A tile's span, in cells. Never a start cell: flow has none. */
  function spanTile(tile, t){
    tile.style.gridColumn = 'span '+t.w;
    tile.style.gridRow    = 'span '+t.h;
  }

  /* One app's tile, redrawn from a fresh spec - the Applications list's
     Refresh. Only that tile changes, in place. The spec is kept for a
     switch to draw from; an app with no tile on screen (on another tab,
     or none drawn yet) has nothing to redraw now. */
  function repaintTile(appId, spec){
    const s = home.specs && home.specs.get(appId);
    if(s) s.spec = spec;
    const t = home.tiles && home.tiles.find(x => x.app_id===appId);
    if(!t) return;
    t.spec = spec;
    const tile = Array.from(document.querySelectorAll('#home .tile')).find(x => x.dataset.app===appId);
    if(!tile) return;
    // Mid-Configure its controls stay: only the face is new.
    const controls = tile.querySelector(':scope > .tile-cfg');
    tile.replaceChildren(renderSpec(spec, t.name, appId));
    if(controls) tile.appendChild(controls);
    releaseTimelines();   // the face just replaced
  }

  /* ---- the sub-header: the subtitle, and Configure ---- */
  function paintHomeHead(){
    const head = $('#homeHead');
    head.replaceChildren();
    if(home.configuring){
      const input = el('input','input home-sub-input');
      input.type = 'text';
      input.value = home.subtitle;      // set as text, never markup
      input.maxLength = SUBTITLE_MAX;
      input.placeholder = 'Add a subtitle';
      input.setAttribute('aria-label','Subtitle');
      input.disabled = home.saving;
      input.oninput = () => { home.subtitle = input.value; };
      head.appendChild(input);
    }else{
      const sub = el('h2','home-sub');
      sub.textContent = home.subtitle;  // set as text, never markup
      head.appendChild(sub);
    }
    const cfg = el('button','tab tab-add home-cfg' + (home.configuring ? ' active' : ''), '<span>Configure</span>');
    cfg.type = 'button';
    cfg.id = 'configureBtn';
    cfg.setAttribute('aria-pressed', home.configuring ? 'true' : 'false');
    cfg.disabled = home.saving || home.status!=='ready';
    cfg.onclick = toggleConfigure;
    head.appendChild(cfg);
  }

  /* A line under the sub-header: good news fades, a problem stays. */
  let homeMsgTimer = null;
  function homeMsg(cls, text){
    const note = $('#homeMsg');
    clearTimeout(homeMsgTimer);
    note.className = 'form-msg home-msg ' + cls;
    note.textContent = text;
    if(cls === 'ok') homeMsgTimer = setTimeout(() => { note.textContent = ''; }, 4000);
  }

  /* ---- the tab strip: the layout's tabs ----
     One tab on the strip per tab of the layout, in its order, before
     Data: its name as text, never markup. Each keeps the strip's own
     form - a .tab with data-tab, its name its text - so Settings'
     Opening page offers it as it does any tab. While Configure is on,
     each has a gear after it (rename it, or delete it) and ＋ Add makes
     a tab; otherwise the strip is just the tabs. Until the layout is
     read, the stand-in in the markup stays. */
  function paintTabStrip(){
    const add = $('#addTabBtn');
    add.hidden = !home.configuring;
    add.disabled = home.saving;
    if(home.layout){
      const strip = [];
      home.layout.tabs.forEach(t => {
        const b = el('button','tab');
        b.type = 'button';
        b.dataset.tab = t.id;
        const label = el('span');
        label.textContent = t.name;
        b.appendChild(label);
        b.onclick = () => switchTab(t.id);
        strip.push(b);
        if(!home.configuring) return;
        const gear = el('button','tab-gear', GEAR);
        gear.type = 'button';
        gear.title = 'Rename or delete this tab';
        gear.setAttribute('aria-label', 'Tab settings: '+t.name);
        gear.setAttribute('aria-haspopup','dialog');
        gear.disabled = home.saving;
        gear.onclick = () => openTabEditor(t);
        strip.push(gear);
      });
      $('#layoutTabs').replaceChildren(...strip);
    }
    markTabs();
  }

  /* Configure on: the tiles get their controls, the subtitle its input
     and the strip its tab controls. Off: the working copy - every tab,
     the one on screen flushed into it - is saved, the tiles go back to
     chromeless, and Home is read again, as the server squares what it
     stored (an id it minted, an app left with no tile). A save that
     fails stays in Configure, the arrangement as it was, to try again. */
  async function toggleConfigure(){
    if(home.saving || home.status!=='ready') return;
    let saved = false;
    if(!home.configuring){
      home.configuring = true;
      homeMsg('info', 'Drag a tile to move it, pick a size where an app offers more than one, or move it to another tab; '
        + 'a tile\'s gear opens its settings. '
        + '＋ Add makes a tab; a tab\'s gear renames or deletes it. Configure again to save.');
    }else{
      flushTab();
      home.saving = true;
      homeMsg('info', 'Saving the layout…');
      paintHomeHead();
      paintTabStrip();
      const grid = $('#home .tiles');
      if(grid) grid.setAttribute('aria-busy','true');
      const res = await api.saveLayout(home.layout);
      home.saving = false;
      if(res.ok){
        home.configuring = false;
        saved = true;
        homeMsg('ok', '✓ Layout saved');
      }else{
        homeMsg('bad', (res.error || "Couldn't save the layout") + ' - nothing is lost: Configure again to retry.');
      }
    }
    paintHomeHead();
    paintHome();
    paintTabStrip();
    if(saved) loadHome();
  }

  /* The layout's one other write: an app just installed, put on the tab
